(function(){try{var m=localStorage.getItem('eqaba_modo');
if(m!=='claro'&&m!=='escuro'){m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';}
document.documentElement.setAttribute('data-modo',m);}catch(e){}})();
</script>

<style>
.barra { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:14px; }
.barra input[type=date] {
    padding:9px 11px; font:inherit; font-size:13px; color:var(--ink);
    border:1px solid var(--line-strong); border-radius:9px; background:var(--surface);
}
.nav-dia {
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    border-radius:9px; width:34px; height:34px; cursor:pointer; font-size:15px; font-weight:700;
}
.nav-dia:hover { background:var(--surface-alt); }
.alternar { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface); }
.alternar button { border:none; background:transparent; padding:9px 14px; font:inherit;
    font-size:12.5px; font-weight:700; color:var(--ink-muted); cursor:pointer; }
.alternar button[aria-pressed="true"] { background:var(--acao); color:#fff; }
.sel-prof {
    padding:9px 11px; font:inherit; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line-strong); border-radius:9px; background:var(--surface); max-width:220px;
}

/* dia */
.sessao { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 0; border-top:1px solid var(--line); }
.sessao:first-child { border-top:none; }
.sessao .hora { font-weight:800; font-size:14px; width:52px; flex:0 0 auto; }
.sessao .quem { flex:1; min-width:170px; }
.sessao .quem b { display:block; font-size:13.5px; }
.sessao .quem span { font-size:11.5px; color:var(--ink-muted); }
.bt-presenca {
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted);
    border-radius:8px; padding:6px 11px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
}
.bt-presenca:hover { border-color:currentColor; }
.bt-presenca[data-on="1"] { color:#fff; border-color:transparent; }

/* semana */
.grade { width:100%; border-collapse:separate; border-spacing:3px; font-size:11.5px; }
.grade th { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft);
            font-weight:700; padding-bottom:4px; text-align:center; }
.grade td { padding:0; vertical-align:top; }
.grade .hcol { width:46px; color:var(--ink-soft); font-weight:700; padding-top:8px; font-size:11px; }
.bloco { border-radius:8px; padding:7px 8px; line-height:1.28; border:1px solid var(--line);
         background:var(--surface); border-left:3px solid var(--cor,var(--acao)); cursor:pointer; }
.bloco:hover { box-shadow:var(--shadow-sm); }
.bloco b { display:block; font-size:11.5px; color:var(--ink); }
.bloco span { font-size:10px; color:var(--ink-muted); }
.bloco.previsto { border-style:dashed; background:var(--surface-alt); opacity:.85; cursor:default; }
.vaga { min-height:36px; border-radius:8px; background:var(--surface-alt); border:1px dashed var(--line); }

/* mês */
.mes { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.mes .cab { font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
            font-weight:700; text-align:center; padding-bottom:3px; }
.dia-cel { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px;
           min-height:62px; cursor:pointer; transition:var(--transition-base); }
.dia-cel:hover { border-color:var(--acao); transform:translateY(-1px); }
.dia-cel.fora { opacity:.3; cursor:default; }
.dia-cel.hoje { border-color:var(--acao); box-shadow:0 0 0 2px var(--acao-soft); }
.dia-cel .n { font-size:11.5px; font-weight:700; }
.dia-cel .qt { font-size:9.5px; color:var(--ink-muted); }
.dia-cel .barras { display:flex; gap:2px; margin-top:5px; }
.dia-cel .barras i { height:4px; border-radius:2px; }
.legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--ink-muted); margin-top:12px; }
.legenda span { display:flex; align-items:center; gap:6px; }
.legenda i { width:11px; height:11px; border-radius:3px; }
.vazio-msg { padding:24px; text-align:center; color:var(--ink-muted); font-size:13px; }
</style>

<body>

<div class="app-shell">
    <div id="sidebar"></div>
    <div class="faixa-perfil"></div>

    <main class="app-main">
        <div class="app-topo">
            <div>
                <h1>Agenda</h1>
                <div class="sub" id="resumo">carregando…</div>
            </div>
            <button class="btn" id="btGerar" style="display:none" onclick="gerarSessoes()">Gerar sessões do dia</button>
        </div>

        <div class="barra">
            <div class="alternar">
                <button id="vDia"    aria-pressed="true"  onclick="trocarVisao('dia')">Dia</button>
                <button id="vSemana" aria-pressed="false" onclick="trocarVisao('semana')">Semana</button>
                <button id="vMes"    aria-pressed="false" onclick="trocarVisao('mes')">Mês</button>
            </div>
            <button class="nav-dia" onclick="andar(-1)" title="Anterior">‹</button>
            <input type="date" id="dataSel" onchange="carregar()">
            <button class="nav-dia" onclick="andar(1)" title="Próximo">›</button>
            <button class="btn btn-secundario" onclick="irHoje()">Hoje</button>
            <select class="sel-prof" id="selProf" onchange="carregar()">
                <option value="">Toda a equipe</option>
            </select>
            <span class="tiny soft" id="rotuloPeriodo"></span>
        </div>

        <div class="card"><div id="area"><div class="muted small">carregando…</div></div></div>
    </main>
</div>

<script src="../shared/sidebar.js?v=8"></script>
<script>
'use strict';

const DIAS_EXT = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_CUR = ['dom','seg','ter','qua','qui','sex','sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const STATUS = {
    agendada:            { r:'Agendada',        c:'var(--st-neutro)' },
    em_andamento:        { r:'Em atendimento',  c:'var(--acao)' },
    realizada:           { r:'Realizada',       c:'var(--st-ok)' },
    falta_justificada:   { r:'Falta c/ aviso',  c:'var(--st-warn)' },
    falta_injustificada: { r:'Falta s/ aviso',  c:'var(--st-bad)' },
    cancelada_clinica:   { r:'Cancelada',       c:'var(--st-warn)' },
    remarcada:           { r:'Remarcada',       c:'var(--st-neutro)' },
    substituicao:        { r:'Cobertura',       c:'var(--st-warn)' },
    feriado:             { r:'Feriado',         c:'var(--st-neutro)' }
};
const RAPIDOS = ['realizada','falta_justificada','falta_injustificada'];

let VISAO = 'dia';
let PERFIL = null;
let PROFS = [];

document.addEventListener('eq:pronto', async function (ev) {
    EqSidebar.render('agenda');
    PERFIL = ev.detail.perfil;
    if (['admin_direcao','coordenador_aba','recepcao'].includes(PERFIL)) {
        document.getElementById('btGerar').style.display = '';
    }
    document.getElementById('dataSel').value = hojeISO();

    try {
        const { data } = await eqClient.from('profissionais')
            .select('id, nome_completo').eq('ativo', true).order('nome_completo');
        PROFS = data || [];
        const sel = document.getElementById('selProf');
        sel.innerHTML = '<option value="">Toda a equipe</option>' +
            PROFS.map(p => `<option value="${p.id}">${p.nome_completo}</option>`).join('');
        // aplicador entra vendo só a própria agenda
        if (['aplicador','aplicador_itinerante','estagiario_aba'].includes(PERFIL)) {
            sel.value = ev.detail.profissional.id;
        }
    } catch (e) { console.warn('não foi possível listar profissionais', e); }

    carregar();
});

// ── datas em horário local ──────────────────────────────────────────────────
const p2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
function hojeISO() { return iso(new Date()); }
function dataSel() { return document.getElementById('dataSel').value || hojeISO(); }
function comoData(s) { const [a,m,d] = s.split('-').map(Number); return new Date(a, m-1, d); }
function irHoje() { document.getElementById('dataSel').value = hojeISO(); carregar(); }

function andar(n) {
    const d = comoData(dataSel());
    if (VISAO === 'dia')    d.setDate(d.getDate() + n);
    if (VISAO === 'semana') d.setDate(d.getDate() + n * 7);
    if (VISAO === 'mes')    d.setMonth(d.getMonth() + n);
    document.getElementById('dataSel').value = iso(d);
    carregar();
}

function trocarVisao(v) {
    VISAO = v;
    document.getElementById('vDia').setAttribute('aria-pressed', v === 'dia');
    document.getElementById('vSemana').setAttribute('aria-pressed', v === 'semana');
    document.getElementById('vMes').setAttribute('aria-pressed', v === 'mes');
    document.getElementById('btGerar').textContent =
        v === 'semana' ? 'Gerar sessões da semana' : 'Gerar sessões do dia';
    carregar();
}

function intervalo() {
    const d = comoData(dataSel());
    if (VISAO === 'dia') return [iso(d), iso(d)];
    if (VISAO === 'semana') {
        const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        const dom = new Date(seg); dom.setDate(seg.getDate() + 6);
        return [iso(seg), iso(dom)];
    }
    const ini = new Date(d.getFullYear(), d.getMonth(), 1);
    const fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return [iso(ini), iso(fim)];
}

// ── carga ───────────────────────────────────────────────────────────────────
async function carregar() {
    const area = document.getElementById('area');
    area.innerHTML = '<div class="muted small">carregando…</div>';
    const [ini, fim] = intervalo();
    const profId = document.getElementById('selProf').value;

    try {
        let q = eqClient.from('sessoes')
            .select(`id, data, hora_inicio, duracao_min, status,
                     paciente:pacientes!sessoes_paciente_id_fkey(id, nome_completo, cartao_seguranca),
                     profissional:profissionais!sessoes_profissional_id_fkey(id, nome_completo)`)
            .gte('data', ini).lte('data', fim)
            .order('data').order('hora_inicio');
        if (profId) q = q.eq('profissional_id', profId);

        const { data, error } = await q;
        if (error) throw error;
        const sessoes = data || [];

        let grade = [];
        if (VISAO === 'semana' && profId) {
            const r = await eqClient.from('cronograma_terapeutico')
                .select('id, dia_semana, hora_inicio, sala, paciente:pacientes(nome_completo)')
                .eq('ativo', true).eq('profissional_id', profId);
            grade = r.data || [];
        }

        if (VISAO === 'dia')    desenharDia(sessoes);
        if (VISAO === 'semana') desenharSemana(sessoes, grade, ini, !!profId);
        if (VISAO === 'mes')    desenharMes(sessoes, ini);

    } catch (e) {
        console.error(e);
        area.innerHTML = '<div class="vazio-msg" style="color:var(--st-bad)">Erro ao carregar. Veja o console.</div>';
    }
}

// ── visão dia ───────────────────────────────────────────────────────────────
function desenharDia(ss) {
    const d = comoData(dataSel());
    document.getElementById('rotuloPeriodo').textContent = DIAS_EXT[d.getDay()];
    const feitas = ss.filter(s => s.status === 'realizada').length;
    const faltas = ss.filter(s => s.status.indexOf('falta') === 0).length;
    document.getElementById('resumo').textContent = ss.length
        ? ss.length + ' sessões · ' + feitas + ' realizadas · ' + faltas + ' faltas'
        : 'Nenhuma sessão neste dia';

    if (!ss.length) {
        document.getElementById('area').innerHTML = '<div class="vazio-msg">Nenhuma sessão lançada. ' +
            (['admin_direcao','coordenador_aba','recepcao'].includes(PERFIL)
             ? 'Use “Gerar sessões do dia” para criar a partir da grade.' : '') + '</div>';
        return;
    }

    document.getElementById('area').innerHTML = ss.map(s => {
        const st = STATUS[s.status] || STATUS.agendada;
        const nome = s.paciente ? s.paciente.nome_completo : '—';
        const bts = RAPIDOS.map(k => `
            <button class="bt-presenca" data-on="${s.status === k ? 1 : 0}"
                    style="${s.status === k ? 'background:' + STATUS[k].c : ''}"
                    onclick="marcar('${s.id}','${k}','${nome.replace(/'/g,'')}')">
                ${STATUS[k].r}</button>`).join('');
        return `<div class="sessao">
            <div class="hora">${s.hora_inicio.slice(0,5)}</div>
            <div class="quem">
                <b>${nome} ${s.paciente && s.paciente.cartao_seguranca
                    ? '<span style="color:var(--st-warn)" title="Cartão de segurança">⚠</span>' : ''}</b>
                <span>${s.profissional ? s.profissional.nome_completo : '—'} · ${s.duracao_min} min</span>
            </div>
            <span class="chip" style="background:transparent;border:1px solid ${st.c};color:${st.c}">${st.r}</span>
            <div style="display:flex;gap:5px;flex-wrap:wrap">${bts}</div>
        </div>`;
    }).join('');
}

// ── visão semana ────────────────────────────────────────────────────────────
// com profissional escolhido → colunas = dias da semana dele
// sem profissional          → colunas = profissionais do dia selecionado
function desenharSemana(ss, grade, segISO, temProf) {
    const seg = comoData(segISO);
    const dias = [0,1,2,3,4].map(i => { const d = new Date(seg); d.setDate(seg.getDate() + i); return d; });
    document.getElementById('rotuloPeriodo').textContent =
        p2(seg.getDate()) + '/' + p2(seg.getMonth()+1) + ' a ' + p2(dias[4].getDate()) + '/' + p2(dias[4].getMonth()+1);
    document.getElementById('resumo').textContent =
        ss.length + ' sessões na semana' + (temProf ? ' · agenda individual' : ' · equipe');

    const diaFoco = dataSel();
    const horas = Array.from(new Set(
        ss.map(s => s.hora_inicio.slice(0,5)).concat(grade.map(g => g.hora_inicio.slice(0,5)))
    )).sort();

    if (!horas.length) {
        document.getElementById('area').innerHTML = '<div class="vazio-msg">Sem sessões nem grade nesta semana.</div>';
        return;
    }

    const colunas = temProf
        ? dias.map(d => ({ id: iso(d), rotulo: DIAS_CUR[d.getDay()] + ' ' + p2(d.getDate()) }))
        : PROFS.filter(p => ss.some(s => s.profissional && s.profissional.id === p.id))
               .map(p => ({ id: p.id, rotulo: p.nome_completo.split(' ')[0] }));

    if (!colunas.length) {
        document.getElementById('area').innerHTML =
            '<div class="vazio-msg">Nenhuma sessão nesta semana para montar as colunas.</div>';
        return;
    }

    const aviso = temProf ? ''
        : '<div class="tiny soft" style="margin-bottom:8px">Colunas = profissionais · dia ' +
          diaFoco.split('-').reverse().join('/') + ' · escolha um profissional para ver a semana inteira dele</div>';

    const corpo = horas.map(h => {
        const celulas = colunas.map(col => {
            const nesta = ss.filter(s => s.hora_inicio.slice(0,5) === h && (temProf
                ? s.data === col.id
                : (s.data === diaFoco && s.profissional && s.profissional.id === col.id)));

            if (nesta.length) {
                return '<td>' + nesta.map(s => {
                    const st = STATUS[s.status] || STATUS.agendada;
                    const nome = s.paciente ? s.paciente.nome_completo : '—';
                    const linha2 = temProf ? st.r
                        : (s.profissional ? s.profissional.nome_completo.split(' ')[0] + ' · ' : '') + st.r;
                    return '<div class="bloco" style="--cor:' + st.c + '" title="' + st.r +
                           '" onclick="abrirDia(\'' + s.data + '\')"><b>' + nome + '</b><span>' + linha2 + '</span></div>';
                }).join('') + '</td>';
            }

            if (temProf) {
                const dow = comoData(col.id).getDay();
                const prev = grade.filter(g => g.dia_semana === dow && g.hora_inicio.slice(0,5) === h);
                if (prev.length) {
                    return '<td>' + prev.map(g =>
                        '<div class="bloco previsto" title="Previsto pela grade — sessão ainda não gerada"><b>' +
                        (g.paciente ? g.paciente.nome_completo : '—') + '</b><span>previsto' +
                        (g.sala ? ' · ' + g.sala : '') + '</span></div>').join('') + '</td>';
                }
            }
            return '<td><div class="vaga"></div></td>';
        }).join('');
        return '<tr><td class="hcol">' + h + '</td>' + celulas + '</tr>';
    }).join('');

    document.getElementById('area').innerHTML = aviso +
        '<div style="overflow-x:auto"><table class="grade"><thead><tr><th></th>' +
        colunas.map(c => '<th>' + c.rotulo + '</th>').join('') +
        '</tr></thead><tbody>' + corpo + '</tbody></table></div>' +
        '<div class="legenda">' +
            '<span><i style="background:var(--st-ok)"></i>realizada</span>' +
            '<span><i style="background:var(--st-bad)"></i>falta sem aviso</span>' +
            '<span><i style="background:var(--st-warn)"></i>falta com aviso ou cobertura</span>' +
            '<span><i style="background:var(--surface-alt);border:1px dashed var(--line)"></i>horário livre — é aqui que cabe paciente novo</span>' +
        '</div>';
}

function abrirDia(data) {
    document.getElementById('dataSel').value = data;
    trocarVisao('dia');
}

// ── visão mês ───────────────────────────────────────────────────────────────
function desenharMes(ss, iniISO) {
    const ini = comoData(iniISO);
    const ano = ini.getFullYear(), mes = ini.getMonth();
    document.getElementById('rotuloPeriodo').textContent = MESES[mes] + ' de ' + ano;

    const porDia = {};
    ss.forEach(s => {
        if (!porDia[s.data]) porDia[s.data] = { total:0, feitas:0, faltas:0 };
        porDia[s.data].total++;
        if (s.status === 'realizada') porDia[s.data].feitas++;
        if (s.status.indexOf('falta') === 0) porDia[s.data].faltas++;
    });

    const feitas = ss.filter(s => s.status === 'realizada').length;
    const faltas = ss.filter(s => s.status.indexOf('falta') === 0).length;
    const taxa = ss.length ? Math.round(faltas / ss.length * 100) : 0;
    document.getElementById('resumo').textContent =
        ss.length + ' sessões no mês · ' + feitas + ' realizadas · ' + faltas + ' faltas (' + taxa + '%)';

    const vazios = new Date(ano, mes, 1).getDay();
    const ultimo = new Date(ano, mes + 1, 0).getDate();
    const hoje = hojeISO();

    let celulas = '';
    for (let i = 0; i < vazios; i++) celulas += '<div class="dia-cel fora"></div>';
    for (let d = 1; d <= ultimo; d++) {
        const chave = ano + '-' + p2(mes+1) + '-' + p2(d);
        const info = porDia[chave];
        const outros = info ? info.total - info.feitas - info.faltas : 0;
        celulas += '<div class="dia-cel ' + (chave === hoje ? 'hoje' : '') +
            '" onclick="abrirDia(\'' + chave + '\')"><div class="n">' + d + '</div>' +
            (info
              ? '<div class="qt">' + info.total + ' sessõe' + (info.total > 1 ? 's' : '') + '</div><div class="barras">' +
                (info.feitas ? '<i style="background:var(--st-ok);flex:' + info.feitas + '"></i>' : '') +
                (info.faltas ? '<i style="background:var(--st-bad);flex:' + info.faltas + '"></i>' : '') +
                (outros      ? '<i style="background:var(--st-neutro);flex:' + outros + '"></i>' : '') +
                '</div>'
              : '') + '</div>';
    }

    document.getElementById('area').innerHTML =
        '<div class="mes">' + DIAS_CUR.map(d => '<div class="cab">' + d + '</div>').join('') + celulas + '</div>' +
        '<div class="legenda">' +
            '<span><i style="background:var(--st-ok)"></i>realizadas</span>' +
            '<span><i style="background:var(--st-bad)"></i>faltas</span>' +
            '<span><i style="background:var(--st-neutro)"></i>agendadas ou outros</span>' +
            '<span>clique no dia para abrir a visão de dia</span>' +
        '</div>';
}

// ── presença ────────────────────────────────────────────────────────────────
async function marcar(id, status, paciente) {
    if (status === 'falta_injustificada') {
        const ok = await EqConfirm.mostrar({
            titulo: 'Marcar falta sem aviso?',
            texto: 'A falta de ' + (paciente || 'paciente') +
                   ' entra no indicador de absenteísmo e, na segunda seguida, gera contato com a família.',
            confirmar: 'Marcar falta', tipo: 'perigo'
        });
        if (!ok) return;
    }
    try {
        const { error } = await eqClient.from('sessoes').update({ status: status }).eq('id', id);
        if (error) throw error;
        await EqAudit.registrar('status', 'sessoes', id, { novo_status: status, paciente: paciente });
        await carregar();
    } catch (e) {
        console.error(e);
        await EqConfirm.mostrar({
            titulo: 'Não foi possível lançar',
            texto: e.message || 'Se você não é o aplicador desta sessão, só a coordenação pode alterá-la.',
            confirmar: 'Entendi', cancelar: 'Fechar', tipo: 'alerta'
        });
    }
}

// ── geração ─────────────────────────────────────────────────────────────────
async function gerarSessoes() {
    const semana = VISAO === 'semana';
    const faixa = intervalo();
    const alvo = semana ? faixa[0] : dataSel();

    const ok = await EqConfirm.mostrar({
        titulo: semana ? 'Gerar sessões da semana?' : 'Gerar sessões deste dia?',
        texto: semana
            ? 'Cria as sessões de segunda a sexta desta semana a partir da grade fixa. O que já existe não é duplicado.'
            : 'Cria as sessões de ' + DIAS_EXT[comoData(alvo).getDay()] + ', ' +
              alvo.split('-').reverse().join('/') + ', a partir da grade. O que já existe não é duplicado.',
        confirmar: 'Gerar', tipo: 'padrao'
    });
    if (!ok) return;

    const bt = document.getElementById('btGerar');
    const rotulo = bt.textContent;
    bt.disabled = true; bt.textContent = 'Gerando...';

    try {
        const dias = [];
        if (semana) {
            for (let i = 0; i < 5; i++) { const d = comoData(alvo); d.setDate(d.getDate() + i); dias.push(iso(d)); }
        } else {
            dias.push(alvo);
        }

        let total = 0;
        for (const dia of dias) {
            // rpc devolve PostgrestBuilder, não Promise — try/catch, nunca .catch()
            const { data, error } = await eqClient.rpc('gerar_sessoes', { p_data: dia });
            if (error) throw error;
            total += data || 0;
        }

        await EqAudit.registrar('criacao', 'sessoes', null, { periodo: dias, quantidade: total });
        await carregar();
        await EqConfirm.mostrar({
            titulo: total > 0 ? total + ' sessões criadas' : 'Nada a criar',
            texto: total > 0
                ? 'Já aparecem na agenda, prontas para o lançamento de presença.'
                : 'Ou já existiam, ou não há grade ativa para este período.',
            confirmar: 'Fechar', cancelar: 'Fechar', tipo: 'padrao'
        });
    } catch (e) {
        console.error(e);
        await EqConfirm.mostrar({
            titulo: 'Não foi possível gerar',
            texto: e.message || 'Erro ao chamar a função no banco.',
            confirmar: 'Entendi', cancelar: 'Fechar', tipo: 'alerta'
        });
    } finally {
        bt.disabled = false; bt.textContent = rotulo;
    }
}
</script>
