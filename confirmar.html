<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar sessao - Equilibrium</title>
  <link rel="icon" type="image/svg+xml" href="icones/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <style>
    .conf-pagina {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .conf-cartao {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--raio);
      box-shadow: var(--shadow-md);
      padding: 30px;
      text-align: center;
      position: relative; z-index: 1;
    }
    .conf-cartao .marca { justify-content: center; margin-bottom: 20px; }
    .conf-cartao h1 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .conf-cartao p { color: var(--ink-muted); font-size: 13px; line-height: 1.6; }
    .conf-detalhe {
      background: var(--surface-alt);
      border: 1px solid var(--line);
      border-radius: var(--raio-sm);
      padding: 14px;
      margin: 18px 0;
      font-size: 14px; font-weight: 700;
    }
    .conf-detalhe small { display: block; color: var(--ink-muted); font-weight: 600; font-size: 12px; margin-top: 4px; }
    .conf-botoes { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .conf-ok { font-size: 40px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="conf-pagina">
    <div class="conf-cartao" id="cartao">
      <div class="marca">
        <span class="simbolo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="16" y1="16" x2="9" y2="9"/><line x1="16" y1="16" x2="23" y2="9"/>
            <line x1="16" y1="16" x2="9" y2="23"/><line x1="16" y1="16" x2="23" y2="23"/>
            <line x1="16" y1="16" x2="16" y2="7"/><line x1="16" y1="16" x2="16" y2="25"/>
            <circle cx="16" cy="16" r="2.8" stroke="none"/>
            <circle cx="9" cy="9" r="1.6" stroke="none"/><circle cx="23" cy="9" r="1.6" stroke="none"/>
            <circle cx="9" cy="23" r="1.6" stroke="none"/><circle cx="23" cy="23" r="1.6" stroke="none"/>
            <circle cx="16" cy="7" r="1.6" stroke="none"/><circle cx="16" cy="25" r="1.6" stroke="none"/>
          </svg>
        </span>
        <span class="nome">CORTEX <span class="mao">aba</span></span>
      </div>
      <div id="conteudo"><p>Carregando...</p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('t');
    const alvo = document.getElementById('conteudo');

    function erroFinal(msg) {
      alvo.innerHTML = '<h1>Ops!</h1><p>' + msg + '</p>' +
        '<p style="margin-top:12px">Se precisar, fale com a recepcao da Equilibrium.</p>';
    }

    async function chamar(resposta) {
      const { data, error } = await sb.rpc('responder_confirmacao',
        { p_token: token, p_resposta: resposta });
      if (error) { erroFinal(error.message); return null; }
      return data;
    }

    function mostrar(info, mensagem) {
      const detalhe =
        '<div class="conf-detalhe">' + info.paciente +
        '<small>' + info.data + ' as ' + info.hora + '</small></div>';

      if (mensagem) {
        alvo.innerHTML = '<div class="conf-ok">' +
          (info.confirmacao === 'confirmada' ? '&#9989;' : '&#128075;') + '</div>' +
          '<h1>' + mensagem + '</h1>' + detalhe +
          '<p>' + (info.confirmacao === 'confirmada'
            ? 'Ate la! Qualquer imprevisto, use este mesmo link para desmarcar.'
            : 'Tudo bem! A equipe ja foi avisada. Se mudar de ideia, fale com a recepcao.') + '</p>';
        return;
      }

      alvo.innerHTML =
        '<h1>Confirmacao de sessao</h1>' +
        '<p>Voce confirma a presenca na sessao abaixo?</p>' +
        detalhe +
        (info.confirmacao === 'confirmada'
          ? '<p><b style="color:var(--st-ok)">Ja confirmada.</b> Precisa desmarcar?</p>'
          : '') +
        '<div class="conf-botoes">' +
        '<button class="btn btn-primario" onclick="responder(\'sim\')">Confirmar presenca</button>' +
        '<button class="btn btn-fantasma" style="color:var(--st-bad); border-color:var(--st-bad)" ' +
        'onclick="if(confirm(\'Desmarcar esta sessao?\')) responder(\'nao\')">Preciso desmarcar</button>' +
        '</div>';
    }

    async function responder(resp) {
      alvo.innerHTML = '<p>Registrando...</p>';
      const info = await chamar(resp);
      if (info) mostrar(info, resp === 'sim' ? 'Presenca confirmada!' : 'Sessao desmarcada');
    }

    (async () => {
      if (!token) { erroFinal('Link invalido.'); return; }
      const info = await chamar(null);
      if (info) {
        if (info.encerrada) {
          erroFinal('Esta sessao ja foi ' +
            (info.status === 'concluida' ? 'realizada' : 'encerrada') + '.');
        } else {
          mostrar(info, null);
        }
      }
    })();
  </script>
</body>
</html>
