<!DOCTYPE html>
<html lang="pt-BR" data-tema="coordenacao">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX aba — Diagnóstico</title>
<script>
(function(){try{var m=localStorage.getItem('eqaba_modo');
if(m!=='claro'&&m!=='escuro'){m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';}
document.documentElement.setAttribute('data-modo',m);}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css?v=4">
<link rel="stylesheet" href="../styles/components.css?v=9">
<style>
.grupo-diag { margin-bottom:18px; }
.grupo-diag h3 { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
                 color:var(--ink-soft); font-weight:700; margin-bottom:8px; padding-left:2px; }
.item-diag { display:flex; gap:13px; align-items:flex-start; padding:13px 15px;
             background:var(--surface); border:1px solid var(--line);
             border-left:3px solid var(--st-neutro); border-radius:11px; margin-bottom:7px;
             transition:var(--transition-base); }
.item-diag:hover { box-shadow:var(--shadow-sm); }
.item-diag.alto  { border-left-color:var(--st-bad); }
.item-diag.medio { border-left-color:var(--st-warn); }
.item-diag.baixo { border-left-color:var(--st-neutro); }
.diag-corpo { flex:1; min-width:0; }
.diag-corpo b { font-size:13.5px; display:block; }
.diag-corpo p { font-size:12px; color:var(--ink-muted); line-height:1.5; margin-top:3px; }
.diag-conta { flex:0 0 auto; min-width:42px; text-align:center; }
.diag-conta b { font-size:19px; font-weight:800; line-height:1; }
.diag-conta span { font-size:9.5px; color:var(--ink-soft); display:block; margin-top:2px; }
.tudo-certo { padding:44px 24px; text-align:center; }
.tudo-certo .icone { width:64px; height:64px; border-radius:50%; background:var(--st-ok-bg);
    color:var(--st-ok); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.placar-diag { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.placar-diag .bloco { flex:1; min-width:120px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:14px; text-align:center; }
.placar-diag .bloco b { font-size:24px; font-weight:800; display:block; line-height:1; }
.placar-diag .bloco span { font-size:11px; color:var(--ink-muted); display:block; margin-top:5px; }
.nota-metodo { font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin-top:14px;
               padding-top:12px; border-top:1px dashed var(--line); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js?v=4"></script>
<script src="../shared/supabase_client.js?v=2"></script>
<script src="../shared/erros.js?v=16"></script>
<script src="../shared/tema.js?v=2"></script>
<script src="../shared/confirm_modal.js?v=3"></script>
<script src="../shared/fotos.js?v=7"></script>
<script src="../shared/config_sistema.js?v=10"></script>
<script src="../shared/audit.js?v=5"></script>
<script src="../shared/auth_guard.js?v=12"></script>
</head>
<body>

<div class="app-shell">
    <div id="sidebar"></div>
    <div class="faixa-perfil"></div>

    <main class="app-main" style="max-width:820px">
        <div class="heroi">
            <div>
                <h1>Diagnóstico</h1>
                <div class="sub" id="subtitulo">verificando…</div>
            </div>
            <button class="btn btn-secundario" onclick="carregar()">Verificar de novo</button>
        </div>

        <div id="area"><div class="card vazio-msg">verificando…</div></div>
    </main>
</div>

<script src="../shared/avisos.js?v=20"></script>
<script src="../shared/sidebar.js?v=17"></script>
<script>
'use strict';

const ORDEM = { alto:0, medio:1, baixo:2 };
const COR   = { alto:'var(--st-bad)', medio:'var(--st-warn)', baixo:'var(--ink-soft)' };
const ROTULO = { alto:'resolver antes de usar', medio:'atrapalha o uso', baixo:'pode esperar' };

let EU_PERFIL = null;

document.addEventListener('eq:pronto', async function (ev) {
    EqSidebar.render('diagnostico');
    EU_PERFIL = ev.detail.perfil;
    if (!['admin_direcao','coordenador_aba','supervisor_clinico'].includes(ev.detail.perfil)) {
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg">Tela restrita à coordenação, supervisão e direção.</div>';
        return;
    }
    await carregar();
});

function raiz() { return '../'; }

async function carregar() {
    document.getElementById('area').innerHTML = '<div class="card vazio-msg">verificando…</div>';
    try {
        const { data, error } = await eqClient.rpc('diagnostico_sistema');
        if (error) throw error;

        // O bloco de banco é assunto de manutenção, não de operação: só a direção
        // vê. Coordenação abrindo o Diagnóstico quer saber de cadastro incompleto,
        // não de arquivo SQL pendente.
        const itens = (data || []).filter(i =>
            i.grupo !== 'Banco de dados' || EU_PERFIL === 'admin_direcao');

        pintar(itens);
        await EqAudit.registrar('acesso', 'diagnostico', null, { itens: (data || []).length });
    } catch (e) {
        console.error(e);
        if (window.EqErros) EqErros.anotar('diagnóstico', e);
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg" style="color:var(--st-bad)">Não foi possível verificar. Veja o console.</div>';
    }
}

function pintar(itens) {
    const altos  = itens.filter(i => i.gravidade === 'alto').length;
    const medios = itens.filter(i => i.gravidade === 'medio').length;
    const baixos = itens.filter(i => i.gravidade === 'baixo').length;

    document.getElementById('subtitulo').textContent = itens.length
        ? itens.length + ' ponto(s) para revisar'
        : 'nada pendente';

    if (!itens.length) {
        document.getElementById('area').innerHTML = `
            <div class="card tudo-certo">
                <div class="icone">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.6" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
                </div>
                <h2 style="font-size:17px;margin-bottom:6px">Nada pendente</h2>
                <p style="font-size:13px;color:var(--ink-muted);line-height:1.6">
                    Cadastro completo, configuração feita e nenhuma tabela desprotegida.
                </p>
            </div>`;
        return;
    }

    // agrupa mantendo a ordem de gravidade dentro de cada grupo
    const grupos = {};
    itens.sort((a,b) => ORDEM[a.gravidade] - ORDEM[b.gravidade]);
    itens.forEach(i => {
        if (!grupos[i.grupo]) grupos[i.grupo] = [];
        grupos[i.grupo].push(i);
    });

    const ordemGrupo = ['Banco de dados','Segurança','Pacientes','Equipe','Configuração','Operação'];
    const chaves = Object.keys(grupos).sort((a,b) =>
        (ordemGrupo.indexOf(a) + 99) % 99 - (ordemGrupo.indexOf(b) + 99) % 99);

    document.getElementById('area').innerHTML = `
    <div class="placar-diag">
        <div class="bloco"><b style="color:${altos ? 'var(--st-bad)' : 'var(--st-ok)'}">${altos}</b>
            <span>resolver antes de usar</span></div>
        <div class="bloco"><b style="color:${medios ? 'var(--st-warn)' : 'var(--ink-soft)'}">${medios}</b>
            <span>atrapalham o uso</span></div>
        <div class="bloco"><b style="color:var(--ink-soft)">${baixos}</b>
            <span>podem esperar</span></div>
    </div>

    ${chaves.map(g => `
        <div class="grupo-diag">
            <h3>${g}</h3>
            ${grupos[g].map(i => `
                <a class="item-diag ${i.gravidade}" href="${raiz() + i.onde}"
                   style="text-decoration:none;color:inherit">
                    <span class="diag-conta">
                        <b style="color:${COR[i.gravidade]}">${i.quantos}</b>
                        <span>${i.quantos === 1 ? 'caso' : 'casos'}</span>
                    </span>
                    <span class="diag-corpo">
                        <b>${i.item}</b>
                        <p>${i.detalhe}</p>
                    </span>
                    <span style="color:var(--ink-soft);font-size:17px;align-self:center">›</span>
                </a>`).join('')}
        </div>`).join('')}

    <div class="card">
        <div class="nota-metodo" style="border-top:none;padding-top:0;margin-top:0">
            Esta tela não conserta nada sozinha — ela aponta. Cada linha leva à tela onde
            se resolve.<br><br>
            <b>Resolver antes de usar</b> é o que faz o sistema mostrar informação errada ou
            deixar dado exposto. <b>Atrapalha o uso</b> é o que trava alguém no meio do trabalho.
            <b>Pode esperar</b> é acúmulo normal de operação.
        </div>
    </div>`;
}
</script>
</body>
</html>
