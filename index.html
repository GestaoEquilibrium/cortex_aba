<!DOCTYPE html>
<html lang="pt-BR" data-tema="coordenacao">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX aba — Acessar</title>
<script>
(function(){try{var m=localStorage.getItem('eqaba_modo');
if(m!=='claro'&&m!=='escuro'){m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';}
document.documentElement.setAttribute('data-modo',m);}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css?v=4">
<link rel="stylesheet" href="styles/components.css?v=7">
<style>
.aba-manuscrito { font-family:'Caveat', cursive; font-size:1.25em; font-weight:700;
                  color:var(--acao); transform:rotate(-6deg); display:inline-block; }

body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
       background: linear-gradient(150deg,#0B1A29 0%, #10322C 100%); }
.login { width:100%; max-width:420px; background:var(--surface); border-radius:20px;
         padding:34px 30px; box-shadow: var(--shadow-lg); }
.login-marca { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px; }
.login-icone { width:54px; height:54px; border-radius:16px; color:#0F766E;
               background: linear-gradient(135deg,#E1F1EE 0%, #D6EFEA 100%);
               display:flex; align-items:center; justify-content:center; }
.login h1 { font-size:20px; }
.login .sub { font-size:12.5px; color:var(--ink-muted); text-align:center; }
.campo { margin-bottom:13px; }
.campo label { display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; }
.campo input { width:100%; padding:11px 13px; font-size:13.5px; font-family:inherit;
               border:1px solid var(--line-strong); border-radius:10px;
               background:var(--surface-alt); color:var(--ink); }
.campo input:focus { outline:2px solid var(--acao); border-color:transparent; }
.recado { display:none; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:13px; }
.recado.erro { display:block; background:var(--st-bad-bg); color:var(--st-bad); }
.recado.info { display:block; background:var(--st-warn-bg); color:var(--st-warn); }
.btn[disabled] { opacity:.6; cursor:progress; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=4"></script>
<script src="shared/supabase_client.js?v=2"></script>
<script src="shared/erros.js?v=16"></script>
<script src="shared/tema.js?v=2"></script>
<script src="shared/audit.js?v=5"></script>
</head>
<body class="tela-escura">

<div class="login">
    <div class="login-marca">
        <div class="login-icone">
            <svg width="28" height="28" viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="11" stroke-linecap="round">
                <line x1="50" y1="12" x2="50" y2="88"/><line x1="17" y1="31" x2="83" y2="69"/><line x1="17" y1="69" x2="83" y2="31"/></g></svg>
        </div>
        <h1>CORTEX <span class="aba-manuscrito">aba</span></h1>
        <div class="sub">Sistema de terapia ABA · Equilibrium Med Center</div>
    </div>

    <div class="recado" id="recado"></div>

    <form id="formLogin">
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" type="email" required autocomplete="username" placeholder="nome@equilibrium.com.br">
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-bloco" type="submit" id="btEntrar">Entrar</button>
    </form>

    <div class="tiny soft" style="text-align:center; margin-top:16px">
        Acesso restrito à equipe. Problemas para entrar? Fale com a coordenação.
    </div>
</div>

<script>
(function () {
    'use strict';
    const recado  = document.getElementById('recado');

    // Cada perfil abre na tela em que ele realmente trabalha, não numa
    // página genérica que ele teria que atravessar todo dia.
    function destinoDe(perfil) {
        switch (perfil) {
            case 'aplicador':
            case 'aplicador_itinerante':
            case 'estagiario_aba':   return 'sessao/sessao.html';
            case 'recepcao':         return 'agenda/agenda.html';
            case 'responsavel':      return 'portal/index.html';
            default:                 return 'dashboard.html';   // coordenação, supervisão, direção
        }
    }
    const bt      = document.getElementById('btEntrar');

    function mostrar(texto, tipo) {
        recado.textContent = texto;
        recado.className = 'recado ' + (tipo || 'erro');
    }

    if (new URLSearchParams(location.search).get('timeout')) {
        mostrar('Sessão encerrada por inatividade. Entre novamente.', 'info');
    }

    // Já tem sessão válida com vínculo? Vai direto para o painel.
    (async function () {
        if (!window.eqClient) return;
        const { data: { session } } = await eqClient.auth.getSession();
        if (!session) return;
        const { data: prof } = await eqClient.from('profissionais')
            .select('id, perfil, ativo').eq('auth_user_id', session.user.id).maybeSingle();
        if (prof && prof.ativo) { location.href = destinoDe(prof.perfil); return; }
        const { data: resp } = await eqClient.from('responsaveis')
            .select('id, perfil, ativo').eq('auth_user_id', session.user.id).maybeSingle();
        if (resp && resp.ativo) { location.href = 'portal/index.html'; return; }
        await eqClient.auth.signOut();   // conta órfã ou inativa: não deixa em loop
    })();

    document.getElementById('formLogin').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        recado.className = 'recado';
        bt.disabled = true; bt.textContent = 'Entrando...';

        try {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            const { data, error } = await eqClient.auth.signInWithPassword({ email, password: senha });
            if (error) {
                mostrar(error.message === 'Invalid login credentials'
                        ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message);
                return;
            }

            const { data: prof } = await eqClient.from('profissionais')
                .select('id, perfil, ativo').eq('auth_user_id', data.user.id).maybeSingle();

            if (!prof) {
                // pode ser responsável: portal da família tem cadastro próprio
                const { data: resp } = await eqClient.from('responsaveis')
                    .select('id, ativo').eq('auth_user_id', data.user.id).maybeSingle();
                if (resp && resp.ativo) {
                    if (data.user.user_metadata && data.user.user_metadata.senha_temporaria) {
                        location.href = 'trocar-senha.html';
                        return;
                    }
                    // sem auditoria aqui: a policy exige profissional_id do próprio usuário,
                    // e responsável não tem linha em profissionais
                    location.href = 'portal/index.html';
                    return;
                }
                await eqClient.auth.signOut();
                mostrar('Esta conta ainda não está vinculada. Fale com a coordenação.');
                return;
            }
            if (!prof.ativo) {
                await eqClient.auth.signOut();
                mostrar('Cadastro inativo. Fale com a coordenação.');
                return;
            }

            // registra a entrada antes de sair da página
            try {
                await eqClient.from('auditoria').insert({
                    profissional_id: prof.id, acao: 'acesso', tabela: 'auth',
                    detalhes: { evento: 'entrada' }, pagina: 'index.html'
                });
            } catch (e) { console.warn('entrada não registrada', e); }

            if (data.user.user_metadata && data.user.user_metadata.senha_temporaria) {
                location.href = 'trocar-senha.html';
                return;
            }
            location.href = destinoDe(prof.perfil);

        } catch (e) {
            console.error(e);
            mostrar('Erro inesperado. Tente novamente.');
        } finally {
            bt.disabled = false; bt.textContent = 'Entrar';
        }
    });
})();
</script>
<script src="shared/pwa.js?v=15"></script>
</body>
</html>
