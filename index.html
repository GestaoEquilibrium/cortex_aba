<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTEX aba - Entrar</title>
  <script src="js/modo.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <div class="login-pagina">

    <section class="login-heroi">
      <div class="marca">
        <span class="simbolo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="16" y1="16" x2="9"  y2="9"/><line x1="16" y1="16" x2="23" y2="9"/>
            <line x1="16" y1="16" x2="9"  y2="23"/><line x1="16" y1="16" x2="23" y2="23"/>
            <line x1="16" y1="16" x2="16" y2="7"/><line x1="16" y1="16" x2="16" y2="25"/>
            <circle cx="16" cy="16" r="2.8" stroke="none"/>
            <circle cx="9"  cy="9"  r="1.6" stroke="none"/><circle cx="23" cy="9"  r="1.6" stroke="none"/>
            <circle cx="9"  cy="23" r="1.6" stroke="none"/><circle cx="23" cy="23" r="1.6" stroke="none"/>
            <circle cx="16" cy="7"  r="1.6" stroke="none"/><circle cx="16" cy="25" r="1.6" stroke="none"/>
          </svg>
        </span>
        <span class="nome">CORTEX <span class="mao">aba</span></span>
      </div>
      <p>Gestao da psicoterapia ABA da Equilibrium Terapia Infantil: admissao, avaliacao, intervencao e acompanhamento em um so lugar.</p>
    </section>

    <section class="login-form-area">
      <form class="login-cartao" onsubmit="fazerLogin(event)">
        <h2>Entrar</h2>
        <p>Use o e-mail e a senha cadastrados pela clinica.</p>

        <div class="mensagem-erro" id="erro-login" role="alert"></div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primario btn-largo" id="botao-entrar">Entrar</button>
      </form>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'app.html';
    });
  </script>
</body>
</html>
