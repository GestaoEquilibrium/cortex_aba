<!DOCTYPE html>
<html lang="pt-BR" data-tema="coordenacao">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQ ABA — Acessar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<style>
body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
       background: linear-gradient(150deg,#0B1A29 0%, #10322C 100%); }
.login {
    width:100%; max-width:420px; background:var(--surface);
    border-radius:20px; padding:34px 30px; box-shadow: var(--shadow-lg);
}
.login-marca { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:22px; }
.login-icone {
    width:54px; height:54px; border-radius:16px; color:#0F766E;
    background: linear-gradient(135deg,#E1F1EE 0%, #D6EFEA 100%);
    display:flex; align-items:center; justify-content:center;
}
.login h1 { font-size:20px; }
.login .sub { font-size:12.5px; color:var(--ink-muted); text-align:center; }
.campo { margin-bottom:13px; }
.campo label { display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; }
.campo input {
    width:100%; padding:11px 13px; font-size:13.5px; font-family:inherit;
    border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-alt); color:var(--ink);
}
.campo input:focus { outline:2px solid var(--acao); outline-offset:0; border-color:transparent; }
.perfis { border-top:1px solid var(--line); margin-top:20px; padding-top:16px; }
.perfis .tt { font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--ink-soft); font-weight:700; margin-bottom:9px; }
.perfis .lista-perfis { display:flex; flex-direction:column; gap:7px; }
.perfil-bt {
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--surface);
    font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left;
}
.perfil-bt:hover { border-color:var(--acao); background:var(--acao-soft); }
.perfil-bt i { width:12px; height:12px; border-radius:4px; flex:0 0 auto; }
.perfil-bt span { color:var(--ink-muted); font-weight:500; margin-left:auto; font-size:11px; }
</style>
<script src="shared/tema.js"></script>
</head>
<body>

<div class="login">
    <div class="login-marca">
        <div class="login-icone">
            <svg width="28" height="28" viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="11" stroke-linecap="round">
                <line x1="50" y1="12" x2="50" y2="88"/><line x1="17" y1="31" x2="83" y2="69"/><line x1="17" y1="69" x2="83" y2="31"/></g></svg>
        </div>
        <h1>EQ ABA</h1>
        <div class="sub">Sistema de terapia ABA · Equilibrium Med Center</div>
    </div>

    <form onsubmit="event.preventDefault(); alert('Sprint 1: autenticação no Supabase.');">
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="nome@equilibrium.com.br" autocomplete="username">
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-bloco" type="submit">Entrar</button>
    </form>

    <div class="perfis">
        <div class="tt">Sprint 0 · entrar como (sem senha)</div>
        <div class="lista-perfis">
            <button class="perfil-bt" onclick="location.href='dashboard.html?perfil=coordenador_aba'">
                <i style="background:#0F766E"></i> Coordenação <span>tema 01</span>
            </button>
            <button class="perfil-bt" onclick="location.href='sessao/sessao.html?perfil=aplicador'">
                <i style="background:#1D4ED8"></i> Aplicador <span>tema 02</span>
            </button>
            <button class="perfil-bt" onclick="location.href='portal/index.html?perfil=responsavel'">
                <i style="background:#7C3AED"></i> Responsável <span>tema 03</span>
            </button>
        </div>
    </div>
</div>

</body>
</html>
