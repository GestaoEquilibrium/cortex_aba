document.documentElement.setAttribute('data-modo',m);}catch(e){}})();

<style>
/* ============================================================================
   Portal da família — o herói é a criança, não o sistema.
   Paleta do tema família: roxo -> ciano. Cor por área, como no CORTEX neuro:
   atividades roxo · atendimentos azul · relatórios verde · termos âmbar.
   ============================================================================ */
:root {
    --p-roxo:   #7C4DFF;
    --p-azul:   #2F6FED;
    --p-ciano:  #06B6D4;
    --p-verde:  #16A34A;
    --p-ambar:  #F59E0B;

    --g-heroi:  linear-gradient(135deg, #4C1D95 0%, #6D28D9 45%, #0E7490 100%);
    --g-roxo:   linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
    --g-azul:   linear-gradient(135deg, #38BDF8 0%, #2F6FED 100%);
    --g-verde:  linear-gradient(135deg, #34D399 0%, #16A34A 100%);
    --g-ambar:  linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);

    --p-raio:   18px;
    --p-pop:    .34s cubic-bezier(.34, 1.56, .64, 1);
}

.portal { max-width: 620px; margin: 0 auto; padding: 0 16px 70px; position: relative; z-index: 1; }

/* ── herói ─────────────────────────────────────────────────────────────── */
.portal-topo {
    background: var(--g-heroi); color: #fff;
    border-radius: 0 0 30px 30px;
    padding: 20px 20px 26px; margin: 0 -16px 20px;
    position: relative; overflow: hidden;
}
/* dois círculos difusos: dão profundidade sem virar enfeite gritante */
.portal-topo::before, .portal-topo::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
}
.portal-topo::before {
    width: 210px; height: 210px; top: -95px; right: -55px;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, transparent 70%);
}
.portal-topo::after {
    width: 160px; height: 160px; bottom: -90px; left: -40px;
    background: radial-gradient(circle, rgba(6,182,212,.28) 0%, transparent 70%);
}
.topo-linha, .crianca, .seletor { position: relative; z-index: 1; }

.topo-linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.marca { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; opacity: .9; }
.aba-manuscrito { font-family: 'Caveat', cursive; font-size: 1.35em; font-weight: 700;
                  display: inline-block; transform: rotate(-6deg); }
.bt-topo { border: none; background: rgba(255,255,255,.16); color: #fff; border-radius: 10px;
           padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
           transition: var(--p-pop); }
.bt-topo:hover { background: rgba(255,255,255,.26); transform: translateY(-1px); }

.crianca { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.foto-crianca {
    width: 66px; height: 66px; border-radius: 20px; flex: 0 0 auto;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; overflow: hidden;
    box-shadow: 0 8px 20px rgba(12,31,63,.25);
}
.foto-crianca img { width: 100%; height: 100%; object-fit: cover; }
.crianca h1 { font-size: 22px; line-height: 1.15; letter-spacing: -.01em; }
.crianca p { font-size: 12.5px; color: rgba(255,255,255,.82); margin-top: 3px; }

.seletor { margin-top: 14px; }
.seletor select {
    width: 100%; padding: 10px 12px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.14);
    color: #fff; font: inherit; font-size: 13px; font-weight: 600;
}
.seletor option { color: #1B1340; }

/* ── o que precisa de você ─────────────────────────────────────────────── */
.acoes { display: grid; gap: 10px; margin-bottom: 22px; }
.acao {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--p-raio); padding: 15px 17px;
    text-align: left; width: 100%; font: inherit; color: var(--ink);
    cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 2px 8px rgba(20,33,58,.05);
    transition: transform var(--p-pop), box-shadow var(--p-pop);
    animation: surgir .4s ease-out both;
}
.acao:nth-child(1) { animation-delay: .05s; }
.acao:nth-child(2) { animation-delay: .12s; }
.acao::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--g-roxo); }
.acao.tipo-termo::before { background: var(--g-ambar); }
.acao:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,33,58,.11); }
.acao-icone {
    width: 42px; height: 42px; border-radius: 13px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124,77,255,.12); color: var(--p-roxo);
}
.acao.tipo-termo .acao-icone { background: rgba(245,158,11,.14); color: var(--p-ambar); }
.acao-texto { flex: 1; min-width: 0; }
.acao-texto b { font-size: 14.5px; display: block; }
.acao-texto span { font-size: 12px; color: var(--ink-muted); line-height: 1.45; }
.acao-seta { color: var(--ink-soft); font-size: 18px; flex: 0 0 auto; }

@keyframes surgir { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ── seções ────────────────────────────────────────────────────────────── */
.secao-titulo {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    font-weight: 800; color: var(--ink-soft); margin: 26px 2px 11px;
}
.secao-titulo::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--p-raio); padding: 17px 18px; margin-bottom: 12px;
    position: relative; overflow: hidden;
    box-shadow: 0 2px 8px rgba(20,33,58,.04);
    animation: surgir .4s ease-out both;
}
/* faixa fina no topo diz de que área é o cartão, sem precisar de rótulo */
.card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--line); }
.card.area-roxo::before  { background: var(--g-roxo); }
.card.area-azul::before  { background: var(--g-azul); }
.card.area-verde::before { background: var(--g-verde); }
.card.area-ambar::before { background: var(--g-ambar); }

.item-titulo { display: flex; justify-content: space-between; align-items: center;
               gap: 10px; margin-bottom: 11px; }
.item-titulo h3 { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }

.orientacao { padding: 13px 0; border-top: 1px solid var(--line); }
.orientacao:first-of-type { border-top: none; padding-top: 0; }
.orientacao p { font-size: 13px; color: var(--ink-muted); line-height: 1.55; margin-top: 4px; }

.linha-sessao { display: flex; justify-content: space-between; align-items: center;
                gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
.linha-sessao:first-of-type { border-top: none; }
.sessao-quando { display: flex; align-items: center; gap: 11px; }
.sessao-dia {
    width: 44px; height: 44px; border-radius: 13px; flex: 0 0 auto;
    background: rgba(47,111,237,.09); color: var(--p-azul);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.sessao-dia b { font-size: 16px; font-weight: 800; }
.sessao-dia span { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }

.bt-feito {
    width: 100%; margin-top: 11px; border: none; border-radius: 12px;
    background: var(--g-verde); color: #fff; font: inherit; font-size: 13.5px;
    font-weight: 700; padding: 12px; cursor: pointer;
    transition: transform var(--p-pop), box-shadow var(--p-pop);
}
.bt-feito:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(22,163,74,.3); }
.bt-feito:active { transform: scale(.98); }

.bt-assinar {
    border: none; border-radius: 10px; background: var(--g-ambar); color: #fff;
    font: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 15px; cursor: pointer;
    transition: transform var(--p-pop);
}
.bt-assinar:hover { transform: translateY(-1px); }

.vazio-msg { padding: 26px 12px; text-align: center; color: var(--ink-muted); font-size: 13px; line-height: 1.6; }
.rodape-portal { text-align: center; font-size: 11.5px; color: var(--ink-soft);
                 margin-top: 30px; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
    .acao, .card { animation: none; }
    .acao:hover, .bt-feito:hover, .bt-assinar:hover { transform: none; }
}
</style>

<body>

<div class="portal">
    <div class="portal-topo">
        <div class="topo-linha">
            <div class="marca">
                <svg width="16" height="16" viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="1.5" fill="currentColor" stroke-linecap="round">
                    <line x1="16" y1="16" x2="9" y2="9"/><line x1="16" y1="16" x2="23" y2="9"/>
                    <line x1="16" y1="16" x2="9" y2="23"/><line x1="16" y1="16" x2="23" y2="23"/>
                    <line x1="16" y1="16" x2="16" y2="7"/><line x1="16" y1="16" x2="16" y2="25"/>
                    <circle cx="16" cy="16" r="2.8" stroke="none"/><circle cx="9" cy="9" r="1.6" stroke="none"/>
                    <circle cx="23" cy="9" r="1.6" stroke="none"/><circle cx="9" cy="23" r="1.6" stroke="none"/>
                    <circle cx="23" cy="23" r="1.6" stroke="none"/><circle cx="16" cy="7" r="1.4" stroke="none"/>
                    <circle cx="16" cy="25" r="1.4" stroke="none"/></g></svg>
                CORTEX <span class="aba-manuscrito">aba</span>
            </div>
            <button class="bt-topo" onclick="sair()" title="Sair">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>

        <div class="crianca" id="cabecalho">
            <div class="foto-crianca" id="fotoCrianca">?</div>
            <div><h1 id="nomeCrianca">carregando…</h1><p id="infoCrianca"></p></div>
        </div>
        <div class="seletor" id="seletorFilhos" style="display:none">
            <select id="selFilho" onchange="carregarFilho()"></select>
        </div>
    </div>

    <div id="area"><div class="card vazio-msg">carregando…</div></div>

    <div class="rodape-portal">
        Precisa avisar uma falta ou remarcar? Fale com a recepção da clínica.
    </div>
</div>

<script>
'use strict';

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let FAMILIA = null, FILHO = null, TERMOS = [], ASSINATURAS = [];

document.addEventListener('eq:familia-pronto', async function (ev) {
    FAMILIA = ev.detail;
    if (!FAMILIA.pacientes.length) {
        document.getElementById('nomeCrianca').textContent = 'Olá, ' + (FAMILIA.responsavel.nome || '').split(' ')[0];
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg">Ainda não há criança vinculada a este acesso.<br>Fale com a recepção da clínica.</div>';
        return;
    }
    if (FAMILIA.pacientes.length > 1) {
        document.getElementById('seletorFilhos').style.display = '';
        document.getElementById('selFilho').innerHTML = FAMILIA.pacientes.map(p =>
            `<option value="${p.id}">${p.nome_completo}</option>`).join('');
    }
    await carregarFilho();
});

const p2 = n => String(n).padStart(2,'0');
function brl(iso) { return iso ? iso.slice(0,10).split('-').reverse().join('/') : '—'; }
function hojeISO() { const d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function idade(nasc) {
    if (!nasc) return '';
    const [a,m,d] = nasc.split('-').map(Number);
    const h = new Date();
    let anos = h.getFullYear() - a;
    if ((h.getMonth()+1 < m) || (h.getMonth()+1 === m && h.getDate() < d)) anos--;
    return anos + (anos === 1 ? ' ano' : ' anos');
}

async function carregarFilho() {
    const id = FAMILIA.pacientes.length > 1
        ? document.getElementById('selFilho').value
        : FAMILIA.pacientes[0].id;
    FILHO = FAMILIA.pacientes.find(p => p.id === id) || FAMILIA.pacientes[0];

    document.getElementById('nomeCrianca').textContent = FILHO.nome_completo;
    document.getElementById('infoCrianca').textContent =
        idade(FILHO.data_nascimento) + (FILHO.parentesco ? ' · ' + FILHO.parentesco : '');

    const foto = document.getElementById('fotoCrianca');
    foto.textContent = (FILHO.nome_completo || '?')[0].toUpperCase();
    if (FILHO.foto_url) {
        try {
            const url = await EqFotos.link(FILHO.foto_url);
            if (url) { foto.style.backgroundImage = 'url(' + url + ')'; foto.textContent = ''; }
        } catch (e) {}
    }

    document.getElementById('area').innerHTML = '<div class="card vazio-msg">carregando…</div>';

    try {
        const hoje = hojeISO();
        const [rOr, rSes, rRel, rTermos, rAssin] = await Promise.all([
            eqClient.from('orientacoes_responsavel').select('*')
                .eq('paciente_id', FILHO.id).eq('ativo', true)
                .order('created_at', { ascending:false }).limit(20),
            eqClient.from('sessoes').select('data, hora_inicio, status')
                .eq('paciente_id', FILHO.id).gte('data', hoje)
                .order('data').order('hora_inicio').limit(6),
            eqClient.from('relatorios_mensais').select('id, mes_referencia, status')
                .eq('paciente_id', FILHO.id).order('mes_referencia', { ascending:false }).limit(6),
            eqClient.from('termos_modelos').select('*').eq('ativo', true).order('tipo'),
            eqClient.from('termos_assinaturas').select('termo_id, assinado_em, versao_assinada')
                .eq('paciente_id', FILHO.id)
        ]);
        TERMOS = rTermos.data || [];
        ASSINATURAS = rAssin.data || [];
        desenhar(rOr.data || [], rSes.data || [], rRel.data || []);
    } catch (e) {
        console.error(e);
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg" style="color:var(--st-bad)">Não foi possível carregar agora. Tente de novo em instantes.</div>';
    }
}

const ROTULO_TIPO = { orientacao:'orientação', atividade:'atividade',
                      recado:'recado', material:'material' };

function desenhar(orientacoes, sessoes, relatorios) {
    const pendentes = orientacoes.filter(o => !o.executado_em && o.tipo === 'atividade');

    const pendentesTermo = TERMOS.filter(t => {
        const a = ASSINATURAS.find(x => x.termo_id === t.id);
        return !a || a.versao_assinada < t.versao;
    });

    // ── O que precisa de você ────────────────────────────────────────────
    // Vem primeiro e como botão, não como aviso cinza: é a única parte do
    // portal que depende da família fazer alguma coisa.
    const acoes = [];
    if (pendentesTermo.length) {
        acoes.push(`
            <button class="acao tipo-termo" onclick="irPara('secao-termos')">
                <span class="acao-icone">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>
                </span>
                <span class="acao-texto">
                    <b>${pendentesTermo.length === 1 ? 'Um termo para ler e assinar'
                                                     : pendentesTermo.length + ' termos para ler e assinar'}</b>
                    <span>São autorizações necessárias para o acompanhamento continuar.</span>
                </span>
                <span class="acao-seta">›</span>
            </button>`);
    }
    if (pendentes.length) {
        acoes.push(`
            <button class="acao" onclick="irPara('secao-orientacoes')">
                <span class="acao-icone">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
                </span>
                <span class="acao-texto">
                    <b>${pendentes.length === 1 ? 'Uma atividade para fazer em casa'
                                                : pendentes.length + ' atividades para fazer em casa'}</b>
                    <span>Quando terminar, marque aqui — assim a equipe sabe como foi.</span>
                </span>
                <span class="acao-seta">›</span>
            </button>`);
    }

    // ── Orientações ──────────────────────────────────────────────────────
    const blocoOrientacoes = orientacoes.length ? orientacoes.map(o => `
        <div class="orientacao">
            <div class="item-titulo">
                <h3 style="font-size:13.5px">${o.titulo}</h3>
                ${o.executado_em ? '<span class="chip chip-ok">feito</span>'
                  : o.tipo === 'atividade' ? '<span class="chip chip-alerta">para fazer</span>'
                  : '<span class="chip chip-neutro">' + (ROTULO_TIPO[o.tipo] || o.tipo) + '</span>'}
            </div>
            <p>${o.texto}</p>
            <div class="tiny soft" style="margin-top:6px">
                enviado em ${brl(o.created_at)}${o.vigencia_ate ? ' · até ' + brl(o.vigencia_ate) : ''}
            </div>
            ${o.tipo === 'atividade' && !o.executado_em
              ? `<button class="bt-feito" onclick="marcarFeito('${o.id}')">Marcar como feito</button>` : ''}
        </div>`).join('')
        : `<div class="vazio-msg">Nenhuma orientação por enquanto.<br>
             <span class="tiny soft">Quando a equipe enviar uma atividade, ela aparece aqui.</span></div>`;

    // ── Atendimentos ─────────────────────────────────────────────────────
    const DIAS_CURTO = ['dom','seg','ter','qua','qui','sex','sáb'];
    const blocoSessoes = sessoes.length ? sessoes.map(s => {
        const [a, m, d] = s.data.split('-').map(Number);
        const dt = new Date(a, m - 1, d);
        return `<div class="linha-sessao">
            <span class="sessao-quando">
                <span class="sessao-dia">
                    <b>${String(d).padStart(2,'0')}</b>
                    <span>${DIAS_CURTO[dt.getDay()]}</span>
                </span>
                <span>
                    <b style="font-size:13.5px">${s.hora_inicio.slice(0,5)}</b>
                    <span class="tiny soft" style="display:block">${MESES[m-1]}</span>
                </span>
            </span>
            <span class="chip ${s.status === 'agendada' ? 'chip-neutro' : 'chip-ok'}">${s.status.replace(/_/g,' ')}</span>
        </div>`; }).join('')
        : `<div class="vazio-msg">Nenhum atendimento agendado no momento.<br>
             <span class="tiny soft">Fale com a clínica se estiver esperando um horário.</span></div>`;

    // ── Relatórios ───────────────────────────────────────────────────────
    const blocoRelatorios = relatorios.length ? relatorios.map(r => {
        const [ano, mes] = r.mes_referencia.split('-').map(Number);
        return `<div class="linha-sessao">
            <span><b style="font-size:13.5px">${MESES[mes-1]}</b>
                  <span class="tiny soft"> de ${ano}</span></span>
            <a class="bt-assinar" style="background:var(--g-verde);text-decoration:none;display:inline-block"
               href="relatorio.html?id=${r.id}">Abrir</a>
        </div>`; }).join('')
        : `<div class="vazio-msg">Nenhum relatório liberado ainda.<br>
             <span class="tiny soft">Os relatórios mensais aparecem aqui depois que a equipe libera.</span></div>`;

    // ── Termos ───────────────────────────────────────────────────────────
    const blocoTermos = TERMOS.length ? `
        <div class="secao-titulo" id="secao-termos">Termos e autorizações</div>
        <div class="card area-ambar">
            <div class="item-titulo">
                <h3>Documentos</h3>
                ${pendentesTermo.length
                  ? `<span class="chip chip-alerta">${pendentesTermo.length} pendente${pendentesTermo.length>1?'s':''}</span>`
                  : '<span class="chip chip-ok">tudo assinado</span>'}
            </div>
            ${TERMOS.map(t => {
                const a = ASSINATURAS.find(x => x.termo_id === t.id);
                const ok = a && a.versao_assinada >= t.versao;
                return `<div class="linha-sessao">
                    <span style="flex:1;min-width:0">
                        <b style="font-size:13.5px">${t.nome}</b>
                        ${ok ? `<span class="tiny soft" style="display:block">assinado em ${brl(a.assinado_em)}</span>` : ''}
                    </span>
                    ${ok ? '<span class="chip chip-ok">assinado</span>'
                         : `<button class="bt-assinar" onclick="abrirTermo('${t.id}')">Ler e assinar</button>`}
                </div>`; }).join('')}
        </div>` : '';

    document.getElementById('area').innerHTML = `
        ${acoes.length ? `<div class="acoes">${acoes.join('')}</div>` : ''}

        <div class="secao-titulo" id="secao-orientacoes">Orientações e atividades</div>
        <div class="card area-roxo">${blocoOrientacoes}</div>

        <div class="secao-titulo">Próximos atendimentos</div>
        <div class="card area-azul">${blocoSessoes}</div>

        <div class="secao-titulo">Relatórios</div>
        <div class="card area-verde">${blocoRelatorios}</div>

        ${blocoTermos}`;
}

function irPara(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function abrirTermo(id) {
    const t = TERMOS.find(x => x.id === id);
    if (!t) return;

    const fundo = document.createElement('div');
    fundo.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(27,19,64,.55);' +
        'backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px';
    fundo.innerHTML = `
        <div style="background:var(--surface);border-radius:18px;padding:22px;max-width:520px;width:100%;
                    max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
            <h3 style="font-size:16px;font-weight:800;margin-bottom:3px">${t.nome}</h3>
            <div class="tiny soft" style="margin-bottom:12px">versão ${t.versao}</div>
            <div id="textoTermo" style="flex:1;overflow:auto;font-size:13px;line-height:1.6;
                        color:var(--ink);background:var(--surface-alt);border:1px solid var(--line);
                        border-radius:12px;padding:14px;white-space:pre-wrap">${t.texto}</div>
            <label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:12.5px;
                          color:var(--ink);cursor:pointer">
                <input type="checkbox" id="aceiteTermo" style="width:auto;margin-top:2px">
                <span>Li o texto acima e concordo, na qualidade de responsável por ${FILHO.nome_completo}.</span>
            </label>
            <div style="display:flex;gap:8px;margin-top:14px">
                <button id="btCancelaTermo" class="btn btn-secundario btn-bloco">Depois</button>
                <button id="btAceitaTermo" class="btn btn-bloco" disabled style="opacity:.5">Assinar</button>
            </div>
        </div>`;
    document.body.appendChild(fundo);

    const check = fundo.querySelector('#aceiteTermo');
    const btOk = fundo.querySelector('#btAceitaTermo');
    check.addEventListener('change', () => {
        btOk.disabled = !check.checked;
        btOk.style.opacity = check.checked ? '1' : '.5';
    });
    fundo.querySelector('#btCancelaTermo').addEventListener('click', () => fundo.remove());

    btOk.addEventListener('click', async function () {
        this.disabled = true; this.textContent = 'Assinando...';
        try {
            const { error } = await eqClient.from('termos_assinaturas').insert({
                termo_id: t.id,
                paciente_id: FILHO.id,
                responsavel_id: FAMILIA.responsavel.id,
                nome_assinante: FAMILIA.responsavel.nome,
                texto_assinado: t.texto,
                versao_assinada: t.versao,
                origem: 'portal'
            });
            if (error) throw error;
            fundo.remove();
            await carregarFilho();
            await EqConfirm.mostrar({
                titulo: 'Termo assinado',
                texto: 'Obrigado. O registro fica guardado com a data e o texto que você leu.',
                confirmar: 'Fechar', cancelar: 'Fechar', tipo: 'padrao'
            });
        } catch (e) {
            console.error(e);
            this.disabled = false; this.textContent = 'Assinar';
            await EqConfirm.mostrar({ titulo:'Não foi possível assinar',
                texto:'Tente novamente em instantes.', confirmar:'Fechar', cancelar:'Fechar', tipo:'alerta' });
        }
    });
}

async function marcarFeito(id) {
    const ok = await EqConfirm.mostrar({
        titulo: 'Marcar como feito?',
        texto: 'A equipe vai ver que a atividade foi realizada em casa.',
        confirmar: 'Marcar', tipo: 'padrao'
    });
    if (!ok) return;
    try {
        const agora = new Date().toISOString();
        const { error } = await eqClient.from('orientacoes_responsavel')
            .update({ executado_em: agora, lido_em: agora }).eq('id', id);
        if (error) throw error;
        await carregarFilho();
    } catch (e) {
        console.error(e);
        await EqConfirm.mostrar({ titulo:'Não foi possível marcar',
            texto:'Tente de novo em instantes.', confirmar:'Fechar', cancelar:'Fechar', tipo:'alerta' });
    }
}

async function sair() {
    const ok = await EqConfirm.mostrar({ titulo:'Sair?', texto:'Você precisará entrar de novo.',
        confirmar:'Sair', tipo:'alerta' });
    if (!ok) return;
    try { await eqClient.auth.signOut(); } catch (e) {}
    window.location.href = '../index.html';
}
</script>
<script src="../shared/pwa.js?v=15"></script>
</body>
