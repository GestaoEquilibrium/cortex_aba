<!DOCTYPE html>
<html lang="pt-BR" data-tema="familia">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX aba — Portal do responsável</title>
<script>
(function(){try{var m=localStorage.getItem('eqaba_modo');
if(m!=='claro'&&m!=='escuro'){m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';}
document.documentElement.setAttribute('data-modo',m);}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.aba-manuscrito { font-family:'Caveat', cursive; font-size:1.3em; font-weight:700;
                  display:inline-block; transform:rotate(-6deg); }
.portal { max-width:470px; margin:0 auto; padding:0 16px 40px; position:relative; z-index:1; }
.portal-topo { background:var(--side-bg); color:#fff; border-radius:0 0 26px 26px;
               padding:20px 20px 24px; margin:0 -16px 18px; }
.topo-linha { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.marca { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; opacity:.92; }
.bt-topo { width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.16); border:none;
           color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.crianca { display:flex; align-items:center; gap:12px; margin-top:16px; }
.foto-crianca { width:52px; height:52px; border-radius:16px; flex:0 0 auto; background:rgba(255,255,255,.2);
                display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800;
                background-size:cover; background-position:center; }
.crianca h1 { font-size:19px; }
.crianca p { font-size:12.5px; color:rgba(255,255,255,.85); }
.seletor { margin-top:12px; }
.seletor select { width:100%; padding:9px 11px; border-radius:9px; border:1px solid rgba(255,255,255,.3);
                  background:rgba(255,255,255,.14); color:#fff; font:inherit; font-size:13px; }
.seletor option { color:#1B1340; }

.item-titulo { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.item-titulo h3 { font-size:14px; }
.card p { font-size:13px; color:var(--ink-muted); line-height:1.5; }
.orientacao + .orientacao { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.linha-sessao { display:flex; justify-content:space-between; align-items:center; gap:10px;
                padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
.linha-sessao:first-child { border-top:none; }
.vazio-msg { padding:18px; text-align:center; color:var(--ink-muted); font-size:12.5px; }
.rodape-portal { text-align:center; margin-top:18px; font-size:11px; color:var(--ink-soft); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js?v=4"></script>
<script src="../shared/supabase_client.js?v=2"></script>
<script src="../shared/erros.js?v=16"></script>
<script src="../shared/tema.js?v=2"></script>
<script src="../shared/confirm_modal.js?v=3"></script>
<script src="../shared/fotos.js?v=7"></script>
<script src="../shared/auth_guard_portal.js?v=12"></script>
</head>
<body>

<div class="portal">
    <div class="portal-topo">
        <div class="topo-linha">
            <div class="marca">
                <svg width="16" height="16" viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="1.5" fill="currentColor" stroke-linecap="round">
                    <line x1="16" y1="16" x2="9" y2="9"/><line x1="16" y1="16" x2="23" y2="9"/>
                    <line x1="16" y1="16" x2="9" y2="23"/><line x1="16" y1="16" x2="23" y2="23"/>
                    <line x1="16" y1="16" x2="16" y2="7"/><line x1="16" y1="16" x2="16" y2="25"/>
                    <circle cx="16" cy="16" r="2.8" stroke="none"/><circle cx="9" cy="9" r="1.6" stroke="none"/>
                    <circle cx="23" cy="9" r="1.6" stroke="none"/><circle cx="9" cy="23" r="1.6" stroke="none"/>
                    <circle cx="23" cy="23" r="1.6" stroke="none"/><circle cx="16" cy="7" r="1.4" stroke="none"/>
                    <circle cx="16" cy="25" r="1.4" stroke="none"/></g></svg>
                CORTEX <span class="aba-manuscrito">aba</span>
            </div>
            <button class="bt-topo" onclick="sair()" title="Sair">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>

        <div class="crianca" id="cabecalho">
            <div class="foto-crianca" id="fotoCrianca">?</div>
            <div><h1 id="nomeCrianca">carregando…</h1><p id="infoCrianca"></p></div>
        </div>
        <div class="seletor" id="seletorFilhos" style="display:none">
            <select id="selFilho" onchange="carregarFilho()"></select>
        </div>
    </div>

    <div id="area"><div class="card vazio-msg">carregando…</div></div>

    <div class="rodape-portal">
        Precisa avisar uma falta ou remarcar? Fale com a recepção da clínica.
    </div>
</div>

<script>
'use strict';

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let FAMILIA = null, FILHO = null, TERMOS = [], ASSINATURAS = [];

document.addEventListener('eq:familia-pronto', async function (ev) {
    FAMILIA = ev.detail;
    if (!FAMILIA.pacientes.length) {
        document.getElementById('nomeCrianca').textContent = 'Olá, ' + (FAMILIA.responsavel.nome || '').split(' ')[0];
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg">Ainda não há criança vinculada a este acesso.<br>Fale com a recepção da clínica.</div>';
        return;
    }
    if (FAMILIA.pacientes.length > 1) {
        document.getElementById('seletorFilhos').style.display = '';
        document.getElementById('selFilho').innerHTML = FAMILIA.pacientes.map(p =>
            `<option value="${p.id}">${p.nome_completo}</option>`).join('');
    }
    await carregarFilho();
});

const p2 = n => String(n).padStart(2,'0');
function brl(iso) { return iso ? iso.slice(0,10).split('-').reverse().join('/') : '—'; }
function hojeISO() { const d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function idade(nasc) {
    if (!nasc) return '';
    const [a,m,d] = nasc.split('-').map(Number);
    const h = new Date();
    let anos = h.getFullYear() - a;
    if ((h.getMonth()+1 < m) || (h.getMonth()+1 === m && h.getDate() < d)) anos--;
    return anos + (anos === 1 ? ' ano' : ' anos');
}

async function carregarFilho() {
    const id = FAMILIA.pacientes.length > 1
        ? document.getElementById('selFilho').value
        : FAMILIA.pacientes[0].id;
    FILHO = FAMILIA.pacientes.find(p => p.id === id) || FAMILIA.pacientes[0];

    document.getElementById('nomeCrianca').textContent = FILHO.nome_completo;
    document.getElementById('infoCrianca').textContent =
        idade(FILHO.data_nascimento) + (FILHO.parentesco ? ' · ' + FILHO.parentesco : '');

    const foto = document.getElementById('fotoCrianca');
    foto.textContent = (FILHO.nome_completo || '?')[0].toUpperCase();
    if (FILHO.foto_url) {
        try {
            const url = await EqFotos.link(FILHO.foto_url);
            if (url) { foto.style.backgroundImage = 'url(' + url + ')'; foto.textContent = ''; }
        } catch (e) {}
    }

    document.getElementById('area').innerHTML = '<div class="card vazio-msg">carregando…</div>';

    try {
        const hoje = hojeISO();
        const [rOr, rSes, rRel, rTermos, rAssin] = await Promise.all([
            eqClient.from('orientacoes_responsavel').select('*')
                .eq('paciente_id', FILHO.id).eq('ativo', true)
                .order('created_at', { ascending:false }).limit(20),
            eqClient.from('sessoes').select('data, hora_inicio, status')
                .eq('paciente_id', FILHO.id).gte('data', hoje)
                .order('data').order('hora_inicio').limit(6),
            eqClient.from('relatorios_mensais').select('id, mes_referencia, status')
                .eq('paciente_id', FILHO.id).order('mes_referencia', { ascending:false }).limit(6),
            eqClient.from('termos_modelos').select('*').eq('ativo', true).order('tipo'),
            eqClient.from('termos_assinaturas').select('termo_id, assinado_em, versao_assinada')
                .eq('paciente_id', FILHO.id)
        ]);
        TERMOS = rTermos.data || [];
        ASSINATURAS = rAssin.data || [];
        desenhar(rOr.data || [], rSes.data || [], rRel.data || []);
    } catch (e) {
        console.error(e);
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg" style="color:var(--st-bad)">Não foi possível carregar agora. Tente de novo em instantes.</div>';
    }
}

function desenhar(orientacoes, sessoes, relatorios) {
    const pendentes = orientacoes.filter(o => !o.executado_em && o.tipo === 'atividade');

    const blocoOrientacoes = orientacoes.length ? orientacoes.map(o => `
        <div class="orientacao">
            <div class="item-titulo">
                <h3>${o.titulo}</h3>
                ${o.executado_em ? '<span class="chip chip-ok">feito</span>'
                  : o.tipo === 'atividade' ? '<span class="chip chip-alerta">para fazer</span>'
                  : '<span class="chip chip-neutro">' + o.tipo + '</span>'}
            </div>
            <p>${o.texto}</p>
            <div class="tiny soft" style="margin-top:5px">
                enviado em ${brl(o.created_at)}${o.vigencia_ate ? ' · até ' + brl(o.vigencia_ate) : ''}
            </div>
            ${o.tipo === 'atividade' && !o.executado_em
              ? `<button class="btn btn-bloco" style="margin-top:9px;background:var(--st-ok)"
                         onclick="marcarFeito('${o.id}')">Marcar como feito</button>` : ''}
        </div>`).join('')
        : '<div class="vazio-msg">Nenhuma orientação por enquanto.</div>';

    const blocoSessoes = sessoes.length ? sessoes.map(s => `
        <div class="linha-sessao">
            <span>${brl(s.data)} · ${s.hora_inicio.slice(0,5)}</span>
            <span class="chip ${s.status === 'agendada' ? 'chip-neutro' : 'chip-ok'}">${s.status.replace(/_/g,' ')}</span>
        </div>`).join('')
        : '<div class="vazio-msg">Nenhum atendimento agendado no momento.</div>';

    const liberados = relatorios;
    const blocoRelatorios = liberados.length ? liberados.map(r => {
        const [ano, mes] = r.mes_referencia.split('-').map(Number);
        return `<div class="linha-sessao">
            <span>${MESES[mes-1]} de ${ano}</span>
            <a class="chip chip-neutro" href="relatorio.html?id=${r.id}">abrir</a>
        </div>`; }).join('')
        : '<div class="vazio-msg">Nenhum relatório liberado ainda.</div>';

    const pendentesTermo = TERMOS.filter(t => {
        const a = ASSINATURAS.find(x => x.termo_id === t.id);
        return !a || a.versao_assinada < t.versao;
    });

    const blocoTermos = TERMOS.length ? `
        <div class="card">
            <div class="item-titulo">
                <h3>Termos e autorizações</h3>
                ${pendentesTermo.length ? `<span class="chip chip-alerta">${pendentesTermo.length} pendente${pendentesTermo.length>1?'s':''}</span>`
                                        : '<span class="chip chip-ok">tudo assinado</span>'}
            </div>
            ${TERMOS.map(t => {
                const a = ASSINATURAS.find(x => x.termo_id === t.id);
                const ok = a && a.versao_assinada >= t.versao;
                return `<div style="padding:9px 0;border-top:1px solid var(--line);display:flex;
                                    justify-content:space-between;align-items:center;gap:10px">
                    <div style="flex:1;min-width:0">
                        <b style="font-size:13px">${t.nome}</b>
                        ${ok ? `<div class="tiny soft">assinado em ${brl(a.assinado_em)}</div>` : ''}
                    </div>
                    ${ok ? '<span class="chip chip-ok">assinado</span>'
                         : `<button class="btn" style="padding:7px 13px;font-size:12px"
                              onclick="abrirTermo('${t.id}')">Ler e assinar</button>`}
                </div>`; }).join('')}
        </div>` : '';

    document.getElementById('area').innerHTML = `
        ${pendentesTermo.length ? `<div class="aviso" style="margin-bottom:12px;border-left-color:var(--st-bad)">
            <b>${pendentesTermo.length} termo${pendentesTermo.length>1?'s':''} aguardando sua leitura.</b>
            São autorizações necessárias para o acompanhamento.
        </div>` : ''}
        ${pendentes.length ? `<div class="aviso" style="margin-bottom:12px;border-left-color:var(--st-warn)">
            <b>${pendentes.length} atividade${pendentes.length>1?'s':''} para fazer em casa.</b>
            Quando terminar, é só marcar aqui — assim a equipe sabe como está indo.
        </div>` : ''}

        <div class="card">
            <div class="item-titulo"><h3>Orientações e atividades</h3></div>
            ${blocoOrientacoes}
        </div>

        <div class="card">
            <div class="item-titulo"><h3>Próximos atendimentos</h3></div>
            ${blocoSessoes}
        </div>

        <div class="card">
            <div class="item-titulo"><h3>Relatórios</h3></div>
            ${blocoRelatorios}
            <div class="card-legenda">Aparecem aqui os relatórios que a coordenação liberou.</div>
        </div>

        ${blocoTermos}`;
}

async function abrirTermo(id) {
    const t = TERMOS.find(x => x.id === id);
    if (!t) return;

    const fundo = document.createElement('div');
    fundo.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(27,19,64,.55);' +
        'backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px';
    fundo.innerHTML = `
        <div style="background:var(--surface);border-radius:18px;padding:22px;max-width:520px;width:100%;
                    max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
            <h3 style="font-size:16px;font-weight:800;margin-bottom:3px">${t.nome}</h3>
            <div class="tiny soft" style="margin-bottom:12px">versão ${t.versao}</div>
            <div id="textoTermo" style="flex:1;overflow:auto;font-size:13px;line-height:1.6;
                        color:var(--ink);background:var(--surface-alt);border:1px solid var(--line);
                        border-radius:12px;padding:14px;white-space:pre-wrap">${t.texto}</div>
            <label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:12.5px;
                          color:var(--ink);cursor:pointer">
                <input type="checkbox" id="aceiteTermo" style="width:auto;margin-top:2px">
                <span>Li o texto acima e concordo, na qualidade de responsável por ${FILHO.nome_completo}.</span>
            </label>
            <div style="display:flex;gap:8px;margin-top:14px">
                <button id="btCancelaTermo" class="btn btn-secundario btn-bloco">Depois</button>
                <button id="btAceitaTermo" class="btn btn-bloco" disabled style="opacity:.5">Assinar</button>
            </div>
        </div>`;
    document.body.appendChild(fundo);

    const check = fundo.querySelector('#aceiteTermo');
    const btOk = fundo.querySelector('#btAceitaTermo');
    check.addEventListener('change', () => {
        btOk.disabled = !check.checked;
        btOk.style.opacity = check.checked ? '1' : '.5';
    });
    fundo.querySelector('#btCancelaTermo').addEventListener('click', () => fundo.remove());

    btOk.addEventListener('click', async function () {
        this.disabled = true; this.textContent = 'Assinando...';
        try {
            const { error } = await eqClient.from('termos_assinaturas').insert({
                termo_id: t.id,
                paciente_id: FILHO.id,
                responsavel_id: FAMILIA.responsavel.id,
                nome_assinante: FAMILIA.responsavel.nome,
                texto_assinado: t.texto,
                versao_assinada: t.versao,
                origem: 'portal'
            });
            if (error) throw error;
            fundo.remove();
            await carregarFilho();
            await EqConfirm.mostrar({
                titulo: 'Termo assinado',
                texto: 'Obrigado. O registro fica guardado com a data e o texto que você leu.',
                confirmar: 'Fechar', cancelar: 'Fechar', tipo: 'padrao'
            });
        } catch (e) {
            console.error(e);
            this.disabled = false; this.textContent = 'Assinar';
            await EqConfirm.mostrar({ titulo:'Não foi possível assinar',
                texto:'Tente novamente em instantes.', confirmar:'Fechar', cancelar:'Fechar', tipo:'alerta' });
        }
    });
}

async function marcarFeito(id) {
    const ok = await EqConfirm.mostrar({
        titulo: 'Marcar como feito?',
        texto: 'A equipe vai ver que a atividade foi realizada em casa.',
        confirmar: 'Marcar', tipo: 'padrao'
    });
    if (!ok) return;
    try {
        const agora = new Date().toISOString();
        const { error } = await eqClient.from('orientacoes_responsavel')
            .update({ executado_em: agora, lido_em: agora }).eq('id', id);
        if (error) throw error;
        await carregarFilho();
    } catch (e) {
        console.error(e);
        await EqConfirm.mostrar({ titulo:'Não foi possível marcar',
            texto:'Tente de novo em instantes.', confirmar:'Fechar', cancelar:'Fechar', tipo:'alerta' });
    }
}

async function sair() {
    const ok = await EqConfirm.mostrar({ titulo:'Sair?', texto:'Você precisará entrar de novo.',
        confirmar:'Sair', tipo:'alerta' });
    if (!ok) return;
    try { await eqClient.auth.signOut(); } catch (e) {}
    window.location.href = '../index.html';
}
</script>
