<!DOCTYPE html>
<html lang="pt-BR" data-tema="equipe">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EQ ABA — Sessão de hoje</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#111827">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css?v=2">
<link rel="stylesheet" href="../styles/components.css?v=3">
<style>
/* Feita para tablet: alvo de toque grande, pouco texto, nada de rolagem lateral. */
.topo-sessao { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.sel-sessao { padding:10px 12px; font:inherit; font-size:13px; color:var(--ink);
              border:1px solid var(--line-strong); border-radius:9px; background:var(--surface); min-width:220px; }
.status-fila { font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px;
               background:var(--st-warn-bg); color:var(--st-warn); display:none; }
.status-fila.on { display:inline-block; }

.cartao-seg { border:1px solid var(--st-warn); background:var(--st-warn-bg); color:#7C4A05;
              border-radius:var(--radius-card); padding:12px 14px; font-size:12.5px; margin-bottom:12px; }
.cartao-seg b { display:block; margin-bottom:3px; }

.prog { border:1px solid var(--line); border-radius:var(--radius-card); padding:14px;
        margin-bottom:12px; background:var(--surface); border-left:4px solid var(--cor,var(--acao)); }
.prog-topo { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:2px; }
.prog-nome { font-size:15px; font-weight:800; }
.prog-meta { font-size:12px; color:var(--ink-muted); margin-bottom:10px; }
.selo-area { font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; color:#fff; white-space:nowrap; }

.alvos { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
.alvo { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted);
        border-radius:999px; padding:5px 12px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
.alvo[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:transparent; }

/* Botões de tentativa: cores funcionais globais, nunca as primárias do tema */
.tentativa { display:flex; gap:8px; }
.tentativa button { flex:1; border:none; border-radius:10px; padding:18px 6px; font:inherit;
                    font-size:13.5px; font-weight:800; color:#fff; cursor:pointer;
                    transition:transform .1s ease, filter .1s ease; }
.tentativa button:active { transform:scale(.97); }
.tentativa button:disabled { opacity:.45; cursor:not-allowed; }
.bt-indep { background:var(--st-ok); } .bt-ajuda { background:var(--st-warn); } .bt-erro { background:var(--st-bad); }

.dicas { display:flex; gap:5px; margin-top:8px; }
.dicas button { flex:1; border:1px solid var(--st-warn); background:var(--st-warn-bg); color:var(--st-warn);
                border-radius:8px; padding:10px 4px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
.dicas button[aria-pressed="true"] { background:var(--st-warn); color:#fff; }
.dica-aviso { font-size:11px; color:var(--ink-soft); margin-top:6px; }

.trilha { display:flex; gap:4px; margin-top:12px; }
.trilha i { flex:1; height:10px; border-radius:3px; background:var(--line); }
.resumo-prog { display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-muted); margin-top:7px; }
.resumo-prog b { color:var(--ink); }

.contexto { display:flex; gap:6px; flex-wrap:wrap; }
.contexto button { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted);
                   border-radius:999px; padding:7px 13px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
.contexto button[aria-pressed="true"] { background:var(--st-warn); color:#fff; border-color:transparent; }

.rodape { position:sticky; bottom:0; background:var(--bg); padding:12px 0 4px;
          border-top:1px solid var(--line); margin-top:8px; }
.modal-fundo { position:fixed; inset:0; background:rgba(17,24,39,.55); backdrop-filter:blur(3px);
               display:none; align-items:center; justify-content:center; padding:20px; z-index:80; }
.modal-fundo.aberto { display:flex; }
.modal { background:var(--surface); border-radius:var(--radius-card); padding:22px; width:100%;
         max-width:520px; box-shadow:var(--shadow-lg); max-height:92vh; overflow:auto; }
.campo label { display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:4px; }
.campo textarea { width:100%; padding:10px 11px; font-size:13px; font-family:inherit;
    border:1px solid var(--line-strong); border-radius:8px; background:var(--surface-alt); color:var(--ink); }
.vazio-msg { padding:26px; text-align:center; color:var(--ink-muted); font-size:13px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js?v=4"></script>
<script src="../shared/supabase_client.js?v=2"></script>
<script src="../shared/tema.js?v=2"></script>
<script src="../shared/confirm_modal.js?v=3"></script>
<script src="../shared/fotos.js?v=7"></script>
<script src="../shared/fila_offline.js?v=8"></script>
<script src="../shared/audit.js?v=5"></script>
<script src="../shared/auth_guard.js?v=7"></script>
</head>
<body>

<div class="app-shell">
    <div id="sidebar"></div>
    <div class="faixa-perfil"></div>

    <main class="app-main" style="max-width:820px">
        <div class="app-topo">
            <div>
                <h1 id="titulo">Sessão de hoje</h1>
                <div class="sub" id="subtitulo">carregando…</div>
            </div>
            <span class="status-fila" id="statusFila"></span>
        </div>

        <div class="topo-sessao">
            <select class="sel-sessao" id="selSessao" onchange="abrirSessao()"></select>
            <span class="chip chip-ok" id="chipStatus" style="display:none"></span>
        </div>

        <div id="area"><div class="muted small">carregando…</div></div>
    </main>
</div>

<!-- ── encerrar e escrever evolução ────────────────────────────────────────── -->
<div class="modal-fundo" id="modalEvolucao" onclick="if(event.target===this) fecharEvolucao()">
    <div class="modal">
        <h2 style="margin-bottom:4px">Evolução do dia</h2>
        <p class="tiny soft" id="resumoEvolucao" style="margin-bottom:14px"></p>
        <form id="formEvolucao">
            <div class="campo" style="margin-bottom:12px">
                <label>Contexto do dia</label>
                <div class="contexto" id="contextoLista"></div>
                <div class="tiny soft" style="margin-top:5px">
                    Meio minuto aqui explica uma queda no gráfico daqui a três semanas.
                </div>
            </div>
            <div class="campo" style="margin-bottom:12px">
                <label for="txtEvolucao">Como foi a sessão</label>
                <textarea id="txtEvolucao" rows="5" placeholder="O que aconteceu, o que funcionou, o que precisa de atenção..."></textarea>
            </div>
            <div class="aviso" id="erroEvolucao" style="display:none;border-left-color:var(--st-bad);color:var(--st-bad);margin-bottom:10px"></div>
            <div class="grid-2">
                <button type="button" class="btn btn-secundario btn-bloco" onclick="fecharEvolucao()">Voltar</button>
                <button type="submit" class="btn btn-bloco" id="btEncerrar">Encerrar sessão</button>
            </div>
        </form>
    </div>
</div>

<script src="../shared/sidebar.js?v=7"></script>
<script>
'use strict';

const AREAS_COR = {
    receptiva:'var(--area-receptiva)', expressiva:'var(--area-expressiva)',
    cognicao:'var(--area-cognicao)', motora:'var(--area-motora)',
    social:'var(--area-social)', autocuidado:'var(--area-autocuidado)'
};
const AREAS_NOME = {
    receptiva:'receptiva', expressiva:'expressiva', cognicao:'cognição',
    motora:'motora', social:'social', autocuidado:'autocuidado'
};
const CONTEXTOS = ['dormiu mal','não almoçou','medicação alterada','doente',
                   'intercorrência em casa','mudança de rotina'];

let EU = null, SESSOES = [], SESSAO = null, PROGRAMAS = [], TENTATIVAS = [];
let ALVO_SEL = {}, DICA_SEL = {};

document.addEventListener('eq:pronto', async function (ev) {
    EqSidebar.render('sessao');
    EU = ev.detail;

    EqFila.aoMudar(atualizarFila);
    atualizarFila(EqFila.pendentes());

    document.getElementById('contextoLista').innerHTML = CONTEXTOS.map(c =>
        `<button type="button" aria-pressed="false" onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed')!=='true')">${c}</button>`).join('');

    await carregarSessoes();
});

function atualizarFila(n) {
    const el = document.getElementById('statusFila');
    if (!el) return;
    el.classList.toggle('on', n > 0);
    el.textContent = n > 0 ? n + ' registro' + (n>1?'s':'') + ' aguardando internet' : '';
}

const p2 = n => String(n).padStart(2,'0');
function hojeISO() { const d = new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }

// ── sessões do dia ──────────────────────────────────────────────────────────
async function carregarSessoes() {
    try {
        let q = eqClient.from('sessoes')
            .select(`id, hora_inicio, duracao_min, status, paciente_id,
                     paciente:pacientes!sessoes_paciente_id_fkey(id, nome_completo, cartao_seguranca)`)
            .eq('data', hojeISO()).order('hora_inicio');
        if (['aplicador','aplicador_itinerante','estagiario_aba'].includes(EU.perfil)) {
            q = q.eq('profissional_id', EU.profissional.id);
        }
        const { data, error } = await q;
        if (error) throw error;
        SESSOES = data || [];

        const sel = document.getElementById('selSessao');
        if (!SESSOES.length) {
            sel.style.display = 'none';
            document.getElementById('subtitulo').textContent = 'Nenhuma sessão para hoje';
            document.getElementById('area').innerHTML =
                '<div class="card vazio-msg">Sem sessões hoje.<br><span class="tiny soft">' +
                'Se deveria haver, peça à coordenação para gerar as sessões do dia na Agenda.</span></div>';
            return;
        }
        sel.innerHTML = SESSOES.map(s =>
            `<option value="${s.id}">${s.hora_inicio.slice(0,5)} · ${s.paciente ? s.paciente.nome_completo : '—'}</option>`).join('');

        const emAberto = SESSOES.find(s => s.status === 'agendada' || s.status === 'em_andamento');
        sel.value = (emAberto || SESSOES[0]).id;
        await abrirSessao();

    } catch (e) {
        console.error(e);
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg" style="color:var(--st-bad)">Erro ao carregar. Veja o console.</div>';
    }
}

async function abrirSessao() {
    const id = document.getElementById('selSessao').value;
    SESSAO = SESSOES.find(s => s.id === id);
    if (!SESSAO) return;
    ALVO_SEL = {}; DICA_SEL = {};

    document.getElementById('area').innerHTML = '<div class="muted small">carregando…</div>';
    document.getElementById('titulo').textContent = SESSAO.paciente ? SESSAO.paciente.nome_completo : 'Sessão';
    document.getElementById('subtitulo').textContent =
        SESSAO.hora_inicio.slice(0,5) + ' · ' + SESSAO.duracao_min + ' min';

    const chip = document.getElementById('chipStatus');
    chip.style.display = '';
    chip.textContent = SESSAO.status.replace(/_/g,' ');
    chip.className = 'chip ' + (SESSAO.status === 'realizada' ? 'chip-ok' : 'chip-neutro');

    try {
        const rpei = await eqClient.from('pei')
            .select('id').eq('paciente_id', SESSAO.paciente_id).eq('status','vigente')
            .order('versao', { ascending:false }).limit(1).maybeSingle();

        if (!rpei.data) {
            PROGRAMAS = [];
        } else {
            const [rprog, rtent] = await Promise.all([
                eqClient.from('pei_programas')
                    .select('*, programa:biblioteca_programas(nome, area, sd, resposta_esperada, dicas), alvos:pei_alvos(id, nome, status, ordem)')
                    .eq('pei_id', rpei.data.id).in('status', ['em_ensino','em_manutencao'])
                    .order('prioridade'),
                eqClient.from('registros_tentativa').select('*').eq('sessao_id', SESSAO.id)
            ]);
            PROGRAMAS = rprog.data || [];
            TENTATIVAS = rtent.data || [];
        }
        desenhar();

    } catch (e) {
        console.error(e);
        document.getElementById('area').innerHTML =
            '<div class="card vazio-msg" style="color:var(--st-bad)">Erro ao carregar o PEI. Veja o console.</div>';
    }
}

// ── desenho ─────────────────────────────────────────────────────────────────
function feitasDe(progId) { return TENTATIVAS.filter(t => t.pei_programa_id === progId); }

function desenhar() {
    const seg = SESSAO.paciente && SESSAO.paciente.cartao_seguranca;
    let html = seg ? `<div class="cartao-seg"><b>Cartão de segurança</b>${seg}</div>` : '';

    if (!PROGRAMAS.length) {
        html += `<div class="card vazio-msg">Este paciente ainda não tem objetivos em ensino no PEI.
            <br><span class="tiny soft">A coordenação monta o PEI na ficha do paciente.</span></div>`;
        document.getElementById('area').innerHTML = html + rodape();
        return;
    }

    html += PROGRAMAS.map(p => {
        const cor = AREAS_COR[p.programa ? p.programa.area : ''] || 'var(--acao)';
        const feitas = feitasDe(p.id);
        const indep = feitas.filter(t => t.resultado === 'independente').length;
        const pct = feitas.length ? Math.round(indep / feitas.length * 100) : 0;
        const total = p.tentativas_por_sessao;
        const alvos = (p.alvos || []).filter(a => a.status !== 'pausado')
                                     .sort((a,b) => (a.ordem||0) - (b.ordem||0));
        const alvoAtual = ALVO_SEL[p.id] || (alvos[0] ? alvos[0].id : null);
        const completo = feitas.length >= total;

        return `<div class="prog" style="--cor:${cor}">
            <div class="prog-topo">
                <div>
                    <div class="prog-nome">${p.programa ? p.programa.nome : '—'}</div>
                    <div class="prog-meta">${p.programa && p.programa.sd ? p.programa.sd : 'sem instrução cadastrada'}</div>
                </div>
                <span class="selo-area" style="background:${cor}">${AREAS_NOME[p.programa ? p.programa.area : ''] || ''}</span>
            </div>

            ${alvos.length ? `<div class="alvos">${alvos.map(a =>
                `<button class="alvo" aria-pressed="${a.id === alvoAtual}"
                         onclick="escolherAlvo('${p.id}','${a.id}')">${a.nome}</button>`).join('')}</div>` : ''}

            <div class="tentativa">
                <button class="bt-indep" ${completo?'disabled':''} onclick="registrar('${p.id}','independente')">Independente</button>
                <button class="bt-ajuda" ${completo?'disabled':''} onclick="registrar('${p.id}','com_ajuda')">Com ajuda</button>
                <button class="bt-erro"  ${completo?'disabled':''} onclick="registrar('${p.id}','erro')">Erro</button>
            </div>

            <div class="dicas">${['gestual','verbal','modelo','fisica'].map(d =>
                `<button type="button" aria-pressed="${DICA_SEL[p.id] === d}"
                         onclick="escolherDica('${p.id}','${d}')">${d === 'fisica' ? 'física' : d}</button>`).join('')}</div>
            <div class="dica-aviso">Ao usar "Com ajuda", marque qual ajuda foi dada — é o que desenha a curva de independência.</div>

            <div class="trilha">${Array.from({length: total}, (_, i) => {
                const t = feitas[i];
                const c = !t ? 'var(--line)'
                        : t.resultado === 'independente' ? 'var(--st-ok)'
                        : t.resultado === 'com_ajuda' ? 'var(--st-warn)' : 'var(--st-bad)';
                return `<i style="background:${c}"></i>`; }).join('')}</div>

            <div class="resumo-prog">
                <span><b>${feitas.length}</b> de ${total} registradas</span>
                <span><b>${pct}%</b> independente${completo ? ' · concluído' : ''}</span>
            </div>
        </div>`;
    }).join('');

    document.getElementById('area').innerHTML = html + rodape();
}

function rodape() {
    const jaEncerrada = SESSAO.status === 'realizada';
    return `<div class="rodape">
        <button class="btn btn-bloco" onclick="abrirEvolucao()" ${jaEncerrada ? 'disabled style="opacity:.6"' : ''}>
            ${jaEncerrada ? 'Sessão já encerrada' : 'Encerrar e escrever evolução'}
        </button>
    </div>`;
}

function escolherAlvo(progId, alvoId) { ALVO_SEL[progId] = alvoId; desenhar(); }
function escolherDica(progId, dica) {
    DICA_SEL[progId] = DICA_SEL[progId] === dica ? null : dica;
    desenhar();
}

// ── registro da tentativa ───────────────────────────────────────────────────
async function registrar(progId, resultado) {
    const p = PROGRAMAS.find(x => x.id === progId);
    if (!p) return;
    const feitas = feitasDe(progId);
    if (feitas.length >= p.tentativas_por_sessao) return;

    const alvos = (p.alvos || []).filter(a => a.status !== 'pausado');
    const alvoId = ALVO_SEL[progId] || (alvos[0] ? alvos[0].id : null);
    const dica = resultado === 'com_ajuda' ? (DICA_SEL[progId] || null) : null;

    const linha = {
        sessao_id: SESSAO.id,
        pei_programa_id: progId,
        alvo_id: alvoId,
        numero: feitas.length + 1,
        resultado: resultado,
        nivel_dica: dica,
        aplicador_id: EU.profissional.id
    };

    // desenha antes de gravar: o toque não espera o servidor
    TENTATIVAS.push(Object.assign({}, linha, { registrado_em: new Date().toISOString() }));
    desenhar();

    const r = await EqFila.gravar('registros_tentativa', linha);
    if (r.offline) atualizarFila(EqFila.pendentes());

    // primeira tentativa marca a sessão como em atendimento
    if (feitas.length === 0 && SESSAO.status === 'agendada') {
        try {
            await eqClient.from('sessoes').update({ status: 'em_andamento' }).eq('id', SESSAO.id);
            SESSAO.status = 'em_andamento';
            const chip = document.getElementById('chipStatus');
            chip.textContent = 'em andamento'; chip.className = 'chip chip-neutro';
        } catch (e) { console.warn(e); }
    }
}

// ── evolução e encerramento ─────────────────────────────────────────────────
function abrirEvolucao() {
    const total = TENTATIVAS.length;
    const indep = TENTATIVAS.filter(t => t.resultado === 'independente').length;
    document.getElementById('resumoEvolucao').textContent = total
        ? total + ' tentativas registradas · ' + Math.round(indep/total*100) + '% independentes'
        : 'Nenhuma tentativa registrada nesta sessão.';
    document.getElementById('modalEvolucao').classList.add('aberto');
}
function fecharEvolucao() {
    document.getElementById('modalEvolucao').classList.remove('aberto');
    document.getElementById('erroEvolucao').style.display = 'none';
}

document.getElementById('formEvolucao').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const bt = document.getElementById('btEncerrar'), erro = document.getElementById('erroEvolucao');
    const texto = document.getElementById('txtEvolucao').value.trim();

    if (!texto) {
        const segue = await EqConfirm.mostrar({
            titulo: 'Encerrar sem escrever a evolução?',
            texto: 'A evolução do dia é o que a coordenação lê para acompanhar o caso e o que alimenta o relatório do mês.',
            confirmar: 'Encerrar assim mesmo', tipo: 'alerta'
        });
        if (!segue) return;
    }

    bt.disabled = true; bt.textContent = 'Encerrando...'; erro.style.display = 'none';
    const contexto = Array.from(document.querySelectorAll('#contextoLista button[aria-pressed="true"]'))
                          .map(b => b.textContent);

    try {
        const { error: e1 } = await eqClient.from('evolucoes_diarias').upsert({
            sessao_id: SESSAO.id,
            paciente_id: SESSAO.paciente_id,
            profissional_id: EU.profissional.id,
            texto: texto || null,
            contexto: contexto.length ? contexto : null
        }, { onConflict: 'sessao_id' });
        if (e1) throw e1;

        const { error: e2 } = await eqClient.from('sessoes')
            .update({ status: 'realizada' }).eq('id', SESSAO.id);
        if (e2) throw e2;

        await EqAudit.registrar('criacao', 'evolucoes_diarias', SESSAO.id, {
            paciente: SESSAO.paciente ? SESSAO.paciente.nome_completo : null,
            tentativas: TENTATIVAS.length,
            contexto: contexto
        });

        fecharEvolucao();
        SESSAO.status = 'realizada';
        document.getElementById('txtEvolucao').value = '';
        document.querySelectorAll('#contextoLista button').forEach(b => b.setAttribute('aria-pressed','false'));
        await EqFila.sincronizar();
        desenhar();

        await EqConfirm.mostrar({
            titulo: 'Sessão encerrada',
            texto: TENTATIVAS.length + ' tentativas gravadas. O gráfico do paciente já está atualizado.',
            confirmar: 'Fechar', cancelar: 'Fechar', tipo: 'padrao'
        });

    } catch (e) {
        console.error(e);
        erro.textContent = 'Não foi possível encerrar: ' + (e.message || 'erro');
        erro.style.display = 'block';
    } finally { bt.disabled = false; bt.textContent = 'Encerrar sessão'; }
});
</script>
</body>
</html>
