<!DOCTYPE html>
<html lang="pt-BR" data-tema="coordenacao">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX aba — Trocar senha</title>
<script>
(function(){try{var m=localStorage.getItem('eqaba_modo');
if(m!=='claro'&&m!=='escuro'){m=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro';}
document.documentElement.setAttribute('data-modo',m);}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css?v=4">
<link rel="stylesheet" href="styles/components.css?v=5">
<style>
body.tela-escura { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
                   background:linear-gradient(150deg,#0B1A29 0%, #10322C 100%); }
.caixa { position:relative; z-index:1; width:100%; max-width:420px; background:var(--surface);
         border-radius:20px; padding:32px 30px; box-shadow:var(--shadow-lg); }
.caixa h1 { font-size:19px; margin-bottom:6px; }
.caixa p.intro { font-size:12.5px; color:var(--ink-muted); line-height:1.5; margin-bottom:18px; }
.campo { margin-bottom:13px; }
.campo label { display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; }
.campo input { width:100%; padding:11px 13px; font-size:13.5px; font-family:inherit;
    border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-alt); color:var(--ink); }
.campo input:focus { outline:2px solid var(--acao); border-color:transparent; }
.forca { height:5px; border-radius:3px; background:var(--line); margin-top:6px; overflow:hidden; }
.forca i { display:block; height:5px; border-radius:3px; width:0; transition:width .2s, background .2s; }
.recado { display:none; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:13px; }
.recado.erro { display:block; background:var(--st-bad-bg); color:var(--st-bad); }
.recado.ok   { display:block; background:var(--st-ok-bg); color:var(--st-ok); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=4"></script>
<script src="shared/supabase_client.js?v=2"></script>
<script src="shared/tema.js?v=2"></script>
</head>
<body class="tela-escura">

<div class="caixa">
    <h1>Escolha sua senha</h1>
    <p class="intro" id="intro">Você entrou com uma senha temporária. Defina uma senha só sua para continuar.</p>

    <div class="recado" id="recado"></div>

    <form id="formSenha">
        <div class="campo">
            <label for="nova">Nova senha</label>
            <input id="nova" type="password" required minlength="8" autocomplete="new-password"
                   oninput="medir()" placeholder="pelo menos 8 caracteres">
            <div class="forca"><i id="barraForca"></i></div>
        </div>
        <div class="campo">
            <label for="repete">Repita a nova senha</label>
            <input id="repete" type="password" required autocomplete="new-password">
        </div>
        <button class="btn btn-bloco" type="submit" id="btSalvar">Salvar e continuar</button>
    </form>

    <div class="tiny soft" style="text-align:center;margin-top:16px">
        Enquanto a senha temporária estiver em uso, o sistema volta para cá.<br>
        <a href="#" onclick="sair();return false;">Sair e voltar depois</a>
    </div>
</div>

<script>
'use strict';

let USUARIO = null;

(async function () {
    const { data: { session } } = await eqClient.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }
    USUARIO = session.user;
    if (!(USUARIO.user_metadata && USUARIO.user_metadata.senha_temporaria)) {
        document.getElementById('intro').textContent =
            'Defina uma nova senha para a sua conta.';
    }
})();

function medir() {
    const v = document.getElementById('nova').value;
    let pontos = 0;
    if (v.length >= 8) pontos++;
    if (v.length >= 12) pontos++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) pontos++;
    if (/[0-9]/.test(v)) pontos++;
    if (/[^A-Za-z0-9]/.test(v)) pontos++;
    const cores = ['var(--st-bad)','var(--st-bad)','var(--st-warn)','var(--st-warn)','var(--st-ok)','var(--st-ok)'];
    const b = document.getElementById('barraForca');
    b.style.width = (pontos / 5 * 100) + '%';
    b.style.background = cores[pontos];
}

function mostrar(texto, tipo) {
    const r = document.getElementById('recado');
    r.textContent = texto;
    r.className = 'recado ' + (tipo || 'erro');
}

async function destino() {
    const { data: prof } = await eqClient.from('profissionais')
        .select('perfil').eq('auth_user_id', USUARIO.id).maybeSingle();
    if (!prof) return 'portal/index.html';
    switch (prof.perfil) {
        case 'aplicador': case 'aplicador_itinerante': case 'estagiario_aba':
            return 'sessao/sessao.html';
        case 'recepcao': return 'agenda/agenda.html';
        default: return 'dashboard.html';
    }
}

document.getElementById('formSenha').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const bt = document.getElementById('btSalvar');
    const nova = document.getElementById('nova').value;
    const repete = document.getElementById('repete').value;

    if (nova !== repete) { mostrar('As duas senhas não são iguais.'); return; }
    if (nova.length < 8) { mostrar('Use pelo menos 8 caracteres.'); return; }

    bt.disabled = true; bt.textContent = 'Salvando...';
    try {
        const { error } = await eqClient.auth.updateUser({
            password: nova,
            data: { senha_temporaria: false }
        });
        if (error) throw error;
        mostrar('Senha alterada. Entrando...', 'ok');
        setTimeout(async () => { location.href = await destino(); }, 900);
    } catch (e) {
        console.error(e);
        mostrar(e.message || 'Não foi possível alterar a senha.');
        bt.disabled = false; bt.textContent = 'Salvar e continuar';
    }
});

async function sair() {
    try { await eqClient.auth.signOut(); } catch (e) {}
    location.href = 'index.html';
}
</script>
<script src="shared/pwa.js?v=15"></script>
</body>
</html>
